<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="940" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MODULO FILTRO GLOBALE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.2 + D5 · dopo il fader, sui bus HPF e LPF: 4 core mono (dec. 159) · HPF 20 Hz–35 kHz, LPF 10 Hz–35 kHz (dec. 137)</text>
  <rect x="1221" y="34" width="299" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1370.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">core (a′) Butterworth 4 poli (dec. 148)</text>
  <rect x="40" y="120" width="200" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="143.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">DAL BACKPLANE</text>
  <text x="140" y="159.55" font-size="10.5" fill="#ddd" text-anchor="middle">bus HPF e bus LPF (net)</text>
  <text x="140" y="175.55" font-size="10.5" fill="#ddd" text-anchor="middle">= somma dei canali assegnati,</text>
  <text x="140" y="191.55" font-size="10.5" fill="#ddd" text-anchor="middle">dopo il fader (dec. 159)</text>
  <rect x="285" y="120" width="150" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="143.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">RICEVITORI</text>
  <text x="360" y="159.55" font-size="10.5" fill="#444" text-anchor="middle">2 bus stereo</text>
  <text x="360" y="175.55" font-size="10.5" fill="#444" text-anchor="middle">virtual-earth Rf 10k</text>
  <text x="360" y="191.55" font-size="10.5" fill="#444" text-anchor="middle">(inverte)</text>
  <rect x="480" y="100" width="330" height="126" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="645" y="136.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">CORE SVF 4 POLI × 4 (mono)</text>
  <text x="645" y="152.05" font-size="10" fill="#444" text-anchor="middle">2 sezioni (a′): Q 0,541 + Q 1,307 (Butterworth)</text>
  <text x="645" y="167.55" font-size="10" fill="#8A4A9E" text-anchor="middle">OTA LM13700 + partitore 1/30 (dec. 109, 148)</text>
  <text x="645" y="183.05" font-size="10" fill="#444" text-anchor="middle">C integratori 1,1 nF · uscita max +2,9 dBu</text>
  <text x="645" y="198.55" font-size="10" fill="#444" text-anchor="middle">(c-B) pulito: progettato e archiviato (dec. 148)</text>
  <rect x="855" y="100" width="270" height="126" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="990" y="136.55" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">OVERDRIVE v0.2 (§5ter)</text>
  <text x="990" y="152.05" font-size="10" fill="#444" text-anchor="middle">tosatore 2,2k + 2+2 diodi, blend sul pulito</text>
  <text x="990" y="167.55" font-size="10" fill="#444" text-anchor="middle">DRIVE: pot doppio lineare, m = θ (dec. 155a)</text>
  <text x="990" y="183.05" font-size="10" fill="#444" text-anchor="middle">niente VCA (todo 212) · servo DC</text>
  <text x="990" y="198.55" font-size="10" fill="#444" text-anchor="middle">esce invertito: rimedio polarità F1</text>
  <rect x="1170" y="120" width="180" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1260" y="143.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">MUTO DI SEZIONE</text>
  <text x="1260" y="159.55" font-size="10.5" fill="#444" text-anchor="middle">tace se nessun canale</text>
  <text x="1260" y="175.55" font-size="10.5" fill="#444" text-anchor="middle">la sceglie</text>
  <text x="1260" y="191.55" font-size="10.5" fill="#444" text-anchor="middle">(bit FILT_MODE, dec. 159)</text>
  <rect x="1395" y="120" width="125" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1457.5" y="151.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">USCITA</text>
  <text x="1457.5" y="167.55" font-size="10.5" fill="#444" text-anchor="middle">2 uscite</text>
  <text x="1457.5" y="183.55" font-size="10.5" fill="#444" text-anchor="middle">→ DJ bus (R 10k)</text>
  <path d="M 240 163 L 283 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 435 163 L 478 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 810 163 L 853 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1125 163 L 1168 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1350 163 L 1393 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1457" y="224" font-size="10.5" fill="#C05A1B" text-anchor="middle">max +2,9 dBu (core)</text>
  <rect x="565" y="262" width="440" height="140" rx="6" fill="#F6F1F8" stroke="#8A4A9E" stroke-width="1.5"/>
  <text x="785" y="290.05" font-size="13" font-weight="700" fill="#8A4A9E" text-anchor="middle">RISONANZA dec. 153 (§5, todo 212)</text>
  <text x="785" y="305.55" font-size="10" fill="#444" text-anchor="middle">gres = gpos − gneg: due OTA, metà dello stesso LM13700</text>
  <text x="785" y="321.05" font-size="10" fill="#444" text-anchor="middle">pot RES lineare cablato rovescio → shaper a diodi → OTA che smorza</text>
  <text x="785" y="336.55" font-size="10" fill="#8A4A9E" text-anchor="middle">sopra il 90 %: raddrizzatore di precisione → OTA che innesca</text>
  <text x="785" y="352.05" font-size="10" fill="#444" text-anchor="middle">Q da 1× a 8× la base fino al 90 %, fischio dal 93,4 %</text>
  <text x="785" y="367.55" font-size="10" fill="#444" text-anchor="middle">fischio col chip vero: +0,2…+0,5 dBu, −2,1…−2,4 semitoni</text>
  <text x="785" y="383.05" font-size="10" fill="#444" text-anchor="middle">limitatore: 4,7k + 2+2 1N4148 verso il summer</text>
  <path d="M 700 262 L 700 228" stroke="#8A4A9E" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <rect x="1035" y="262" width="485" height="126" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1053" y="289.2" font-size="12" font-weight="700" fill="#141414">SOMMA DEI CANALI (todo 215, RISULTATI-D5 §7)</text>
  <text x="1053" y="305.2" font-size="10.5" fill="#444">Ricevitore a guadagno 1 per canale: 2 correlati +6, 4 correlati +12 dBu.</text>
  <text x="1053" y="321.2" font-size="10.5" fill="#444">In banda la somma passa senza perdite fino a +12 dBu.</text>
  <text x="1053" y="337.2" font-size="10.5" fill="#444">Sul taglio il core ha un tetto fra −1 e +1,2 dBu: con 2 canali correlati</text>
  <text x="1053" y="353.2" font-size="10.5" fill="#8A4A9E">la risonanza sul programma sparisce: da sentire (docs/02 A23).</text>
  <text x="1053" y="369.2" font-size="10.5" fill="#444">DRIVE a fine corsa: 19 / 29 / 34 % a 0 / +6 / +12 dBu (dec. 159d).</text>
  <rect x="40" y="420" width="1480" height="304" rx="10" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="66" y="452" font-size="15" font-weight="700" fill="#2F6D8E">SEZIONE CONTROLLO — 6 manopole: FREQ, RES, DRIVE per la sezione HPF e per la LPF</text>
  <rect x="66" y="476" width="225" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="178.5" y="501.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">LAW SHAPER</text>
  <text x="178.5" y="517.45" font-size="10" fill="#444" text-anchor="middle">law Xone:96 (dec. 102)</text>
  <text x="178.5" y="532.95" font-size="10" fill="#444" text-anchor="middle">HPF 20 Hz · 1000^(θ/0,95) (137)</text>
  <text x="178.5" y="548.45" font-size="10" fill="#444" text-anchor="middle">LPF 10 Hz–35 kHz</text>
  <rect x="336" y="476" width="235" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="453.5" y="501.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">CONVERTER EXPO</text>
  <text x="453.5" y="517.45" font-size="10" fill="#444" text-anchor="middle">coppia BJT matched, ΔVbe PTAT:</text>
  <text x="453.5" y="532.95" font-size="10" fill="#444" text-anchor="middle">Iabc 114 nA…397 µA = 10,6 Hz…37 kHz</text>
  <text x="453.5" y="548.45" font-size="10" fill="#444" text-anchor="middle">deriva ≤ 2,4 % (0-50 °C)</text>
  <rect x="616" y="476" width="235" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="733.5" y="501.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">DISTRIBUZIONE</text>
  <text x="733.5" y="517.45" font-size="10" fill="#444" text-anchor="middle">mirror bufferizzati + trim/core</text>
  <text x="733.5" y="532.95" font-size="10" fill="#444" text-anchor="middle">2 rami per sezione (dec. 159)</text>
  <text x="733.5" y="548.45" font-size="10" fill="#444" text-anchor="middle">tracking ≤ 1,6 % PASS</text>
  <rect x="906" y="476" width="270" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1041" y="501.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">RES: SHAPER + RADDRIZZATORE</text>
  <text x="1041" y="517.45" font-size="10" fill="#444" text-anchor="middle">pot lineare rovescio, +5 V di riferimento</text>
  <text x="1041" y="532.95" font-size="10" fill="#444" text-anchor="middle">soglia del fischio = rapporto di R</text>
  <text x="1041" y="548.45" font-size="10" fill="#444" text-anchor="middle">da 20 a 50 °C: ≤ 1,6 %</text>
  <rect x="1221" y="476" width="273" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1357.5" y="501.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">DRIVE A POT DOPPIO</text>
  <text x="1357.5" y="517.45" font-size="10" fill="#444" text-anchor="middle">una manopola = una coppia di celle</text>
  <text x="1357.5" y="532.95" font-size="10" fill="#444" text-anchor="middle">m = θ esatto, senza shaper</text>
  <text x="1357.5" y="548.45" font-size="10" fill="#444" text-anchor="middle">22 µF: niente continua sul pot</text>
  <path d="M 291 521 L 334 521" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 571 521 L 614 521" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 733.5 476 L 733.5 412 L 530 412 L 530 228" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="520" y="300" font-size="10" fill="#2F6D8E" text-anchor="end">Iabc →</text>
  <text x="520" y="314" font-size="10" fill="#2F6D8E" text-anchor="end">integratori</text>
  <rect x="66" y="586" width="1428" height="118" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="84" y="617.2" font-size="12" font-weight="700" fill="#1F7A4D">VERIFICATO COL MODELLO REALE DELL'LM13700</text>
  <text x="84" y="633.2" font-size="10.5" fill="#444">Core (a) nudo SCARTATO: picco di risonanza sotto −12 dBu, programma 0 dBu −23 dB sul taglio, oscillazione 3,5 ottave sotto FREQ.</text>
  <text x="84" y="649.2" font-size="10.5" fill="#444">Core (a′) 1/30: piccolo segnale esatto · risonanza piena a −30 dBu · THD core 1,5-2 % a 0 dBu · offset ×30 dentro la corsa del servo.</text>
  <text x="84" y="665.2" font-size="10.5" fill="#444">Rumore del sistema a DRIVE chiuso: −78,0 dBu A con HPF e LPF in uso, −79,2 solo HPF, −80,6 solo LPF (docs/06 §16): entro il −78.</text>
  <text x="84" y="681.2" font-size="10.5" fill="#444">DRIVE aperto: −72,0 con le due sezioni, nella condizione d'uso accettata (dec. 100). Il FAIL dei 4 core in serie (A18) sparisce.</text>
  <rect x="40" y="744" width="900" height="66" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="769.925" font-size="10.5" fill="#444">RAIL: tutti gli OTA su ±15,0 V ultra-low-noise dal ±19 V LN (pre-reg ±16,5 → LT3045/94) — LM13700 assoluto ±18</text>
  <text x="58" y="785.925" font-size="10.5" fill="#444">BOM: 12 LM13700 (8 core + 4 RES) · ~12 quad · C 1,1 nF C0G/PP matched · 0 VCA (DRIVE a pot) · ~450 componenti [STIMA]</text>
  <rect x="980" y="744" width="540" height="66" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="998" y="769.925" font-size="10.5" fill="#444">PROTOTIPO: MC-FILTRO-HPF e -LPF sulle tracce BUS (todo 216)</text>
  <text x="998" y="785.925" font-size="10.5" fill="#444">valori dei componenti [PROVVISORIO] fino al banco</text>
  <path d="M 40 850 L 90 850" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="854" font-size="11.5" fill="#333">audio (bus → DJ bus)</text>
  <path d="M 262 850 L 312 850" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="320" y="854" font-size="11.5" fill="#333">controllo CV / Iabc</text>
  <path d="M 477 850 L 527 850" stroke="#8A4A9E" stroke-width="2.2"/>
  <text x="535" y="854" font-size="11.5" fill="#333">risonanza / nota evidenziata</text>
  <text x="40" y="918" font-size="10.5" fill="#999">Fonte: docs/fase2/filter-module.md (§2bis, §4, §5 RES dec. 153, §5ter DRIVE a pot, §5quater) + sim/filtro/RISULTATI-D5.md §7 + docs/06 §16 + decisioni 102/109/137/148/153/155/159 · 2026-11-04</text>
</svg>
