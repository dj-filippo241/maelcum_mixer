<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="920" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MODULO FILTRO GLOBALE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.2 + D5 (dec. 109) · stile Sherman: 2 sezioni full-range 10 Hz–35 kHz, 8 core mono, un percorso per canale (dec. 101)</text>
  <rect x="1235" y="34" width="285" height="24" rx="12" fill="#D97706"/>
  <text x="1377.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">B1: (a′) OTA o (c-B) pulito — ascolto</text>
  <rect x="40" y="120" width="200" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="143.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">DAL BACKPLANE</text>
  <text x="140" y="159.55" font-size="10.5" fill="#ddd" text-anchor="middle">4 × send stereo (pre-fader,</text>
  <text x="140" y="175.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ canale) + bit di modo</text>
  <text x="140" y="191.55" font-size="10.5" fill="#ddd" text-anchor="middle">0 dBu / +16 worst</text>
  <rect x="290" y="120" width="140" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="360" y="151.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER IN</text>
  <text x="360" y="167.55" font-size="10.5" fill="#444" text-anchor="middle">× 4 sezioni stereo</text>
  <text x="360" y="183.55" font-size="10.5" fill="#444" text-anchor="middle">(CH1…CH4 L/R)</text>
  <rect x="480" y="100" width="330" height="126" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="645" y="136.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">CORE SVF 4 POLI × 8 (mono)</text>
  <text x="645" y="152.05" font-size="10" fill="#444" text-anchor="middle">2 sezioni 2 poli in cascata (allineamento = q. 64)</text>
  <text x="645" y="167.55" font-size="10" fill="#8A4A9E" text-anchor="middle">(a′) OTA LM13700 + partitore 1/30 (dec. 109)</text>
  <text x="645" y="183.05" font-size="10" fill="#444" text-anchor="middle">C integratori 1,1 nF · tetto di stato 1,56 V</text>
  <text x="645" y="198.55" font-size="10" fill="#444" text-anchor="middle">(c-B) op-amp + VCA: alternativa pulita (B1)</text>
  <rect x="860" y="120" width="180" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="950" y="143.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">MUX MODO</text>
  <text x="950" y="159.55" font-size="10.5" fill="#444" text-anchor="middle">HPF / OFF (bypass) / LPF</text>
  <text x="950" y="175.55" font-size="10.5" fill="#444" text-anchor="middle">un percorso per canale</text>
  <text x="950" y="191.55" font-size="10.5" fill="#444" text-anchor="middle">BBM + ramp 1 ms (dec. 80)</text>
  <rect x="1090" y="100" width="260" height="126" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="1220" y="136.55" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">OVERDRIVE v0.2 (§5ter)</text>
  <text x="1220" y="152.05" font-size="10" fill="#444" text-anchor="middle">tosatore in parallelo al pulito (dec. 99)</text>
  <text x="1220" y="167.55" font-size="10" fill="#444" text-anchor="middle">1 VCA 218x per cella sulla differenza</text>
  <text x="1220" y="183.05" font-size="10" fill="#444" text-anchor="middle">law θ^2,5: morde nell'ultimo quarto</text>
  <text x="1220" y="198.55" font-size="10" fill="#444" text-anchor="middle">tetto +5,5 dBu · servo DC</text>
  <rect x="1400" y="120" width="120" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1460" y="151.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">USCITA</text>
  <text x="1460" y="167.55" font-size="10.5" fill="#444" text-anchor="middle">R serie 33 Ω</text>
  <text x="1460" y="183.55" font-size="10.5" fill="#444" text-anchor="middle">→ return canale</text>
  <path d="M 240 163 L 288 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 430 163 L 478 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 810 163 L 858 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1040 163 L 1088 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1350 163 L 1398 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1460" y="224" font-size="10.5" fill="#C05A1B" text-anchor="middle">0 dBu nom · max +5,5 dBu</text>
  <rect x="560" y="262" width="390" height="110" rx="6" fill="#F6F1F8" stroke="#8A4A9E" stroke-width="1.5"/>
  <text x="755" y="290.55" font-size="13" font-weight="700" fill="#8A4A9E" text-anchor="middle">RISONANZA + LIMITATORE (dec. 109)</text>
  <text x="755" y="306.05" font-size="10" fill="#444" text-anchor="middle">OTA nel summer: 1/Q = Rf · gm_res (Iabc 221 µA × |gres|)</text>
  <text x="755" y="321.55" font-size="10" fill="#8A4A9E" text-anchor="middle">limitatore = perdita non lineare dal buffer BP:</text>
  <text x="755" y="337.05" font-size="10" fill="#8A4A9E" text-anchor="middle">4,7k + 2+2 1N4148 → summer (livello uguale a ogni FREQ)</text>
  <text x="755" y="352.55" font-size="10" fill="#444" text-anchor="middle">auto-osc. +4,9 dBu a fine corsa, nota −1,3…−5,7 semitoni</text>
  <path d="M 700 262 L 700 228" stroke="#8A4A9E" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <rect x="990" y="262" width="530" height="110" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1008" y="289.2" font-size="12" font-weight="700" fill="#141414">D5: COSA ARRIVA ALL'OVERDRIVE (sim/filtro/RISULTATI-D5.md)</text>
  <text x="1008" y="305.2" font-size="10.5" fill="#444">Il fischio arriva a −1,5…+2 dBu, non a +8: il chip reale lo comprime.</text>
  <text x="1008" y="321.2" font-size="10.5" fill="#444">Fine corsa: 15-20 % di THD sul fischio (griglia dec. 99: 31 %), e sale.</text>
  <text x="1008" y="337.2" font-size="10.5" fill="#444">Il primo sporco (1,3-2 %) lo fa il core; programma e fischio insieme.</text>
  <text x="1008" y="353.2" font-size="10.5" fill="#8A4A9E">Griglia overdrive, law RES e oscillazione da riconfermare (voce A17).</text>
  <rect x="40" y="410" width="1480" height="300" rx="10" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="66" y="442" font-size="15" font-weight="700" fill="#2F6D8E">SEZIONE CONTROLLO — 6 knob: FREQ, RES, DRIVE per la sezione HPF e per la LPF (0-5 V)</text>
  <rect x="66" y="466" width="215" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="173.5" y="491.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">LAW SHAPER</text>
  <text x="173.5" y="507.45" font-size="10" fill="#444" text-anchor="middle">law Xone:96 (dec. 102):</text>
  <text x="173.5" y="522.95" font-size="10" fill="#444" text-anchor="middle">expo 20 Hz–20 kHz sul 90 %,</text>
  <text x="173.5" y="538.45" font-size="10" fill="#444" text-anchor="middle">10 Hz / 35 kHz negli ultimi 5 %</text>
  <rect x="331" y="466" width="235" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="448.5" y="491.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">CONVERTER EXPO</text>
  <text x="448.5" y="507.45" font-size="10" fill="#444" text-anchor="middle">coppia BJT matched, ΔVbe PTAT:</text>
  <text x="448.5" y="522.95" font-size="10" fill="#444" text-anchor="middle">Iabc 114 nA…397 µA = 10,6 Hz…37 kHz</text>
  <text x="448.5" y="538.45" font-size="10" fill="#444" text-anchor="middle">deriva ≤ 2,4 % (0-50 °C)</text>
  <rect x="616" y="466" width="235" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="733.5" y="491.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">DISTRIBUZIONE</text>
  <text x="733.5" y="507.45" font-size="10" fill="#444" text-anchor="middle">mirror bufferizzati × 8 + trim/core</text>
  <text x="733.5" y="522.95" font-size="10" fill="#444" text-anchor="middle">tracking ≤ 1,6 % PASS</text>
  <text x="733.5" y="538.45" font-size="10" fill="#444" text-anchor="middle">(mappa invariata col partitore)</text>
  <rect x="901" y="466" width="260" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1031" y="491.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">RAMP BBM (VALIDATA)</text>
  <text x="1031" y="507.45" font-size="10" fill="#444" text-anchor="middle">commutazione modo al picco +18 dBu:</text>
  <text x="1031" y="522.95" font-size="10" fill="#444" text-anchor="middle">τ 1 ms = click −8,4 dB</text>
  <text x="1031" y="538.45" font-size="10" fill="#444" text-anchor="middle">famiglia unica 1 ms (dec. 80)</text>
  <rect x="1211" y="466" width="283" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1352.5" y="491.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">RES + DRIVE CV</text>
  <text x="1352.5" y="507.45" font-size="10" fill="#444" text-anchor="middle">RES: law Xone, oscillazione sul 90-100 %</text>
  <text x="1352.5" y="522.95" font-size="10" fill="#444" text-anchor="middle">DRIVE: SPDT per canale sceglie la sezione</text>
  <text x="1352.5" y="538.45" font-size="10" fill="#444" text-anchor="middle">attiva (dec. 101) · smoothing 1 ms</text>
  <path d="M 281 511 L 329 511" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 566 511 L 614 511" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 851 511 L 899 511" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 1161 511 L 1209 511" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 733.5 466 L 733.5 392 L 520 392 L 520 228" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="510" y="300" font-size="10" fill="#2F6D8E" text-anchor="end">Iabc →</text>
  <text x="510" y="314" font-size="10" fill="#2F6D8E" text-anchor="end">integratori</text>
  <rect x="66" y="576" width="1428" height="112" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="84" y="604.2" font-size="12" font-weight="700" fill="#1F7A4D">VERIFICATO COL MODELLO REALE DELL'LM13700 (fix 2026-10-14: mirror d'uscita completo)</text>
  <text x="84" y="620.2" font-size="10.5" fill="#444">Core (a) nudo SCARTATO: picco di risonanza sotto −12 dBu, programma 0 dBu −23 dB sul taglio, oscillazione 3,5 ottave sotto FREQ.</text>
  <text x="84" y="636.2" font-size="10.5" fill="#444">Core (a′) 1/30: piccolo segnale esatto (2 poli Q 0,707) · risonanza piena a −30 dBu, +8,5 dB a −10 dBu, ~+1 dB a 0 dBu · THD core 1,5-2 % a 0 dBu.</text>
  <text x="84" y="652.2" font-size="10.5" fill="#444">Rumore core −87,4 dBu A-wtd a fc max · sistema con 4 filtri inseriti e overdrive chiuso −79,0 (target −78: PASS 1,0, docs/06 §11).</text>
  <text x="84" y="668.2" font-size="10.5" fill="#444">Offset in continua ×30 sugli stati: 3,9 mV tipico, ~40 mV col Vos massimo, dentro la corsa del servo (83 mV).</text>
  <rect x="40" y="732" width="900" height="66" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="757.925" font-size="10.5" fill="#444">RAIL: tutti gli OTA su ±15,0 V ultra-low-noise dal raw ±22 V (pre-reg ±16,5 → LT3045/94, dec. 93) — LM13700 assoluto ±18</text>
  <text x="58" y="773.925" font-size="10.5" fill="#444">BOM v0.1: 20 LM13700 (filter-module §7) + partitori 2,9k/100 Ω + C 1,1 nF C0G/PP matched · overdrive: 8 VCA 218x</text>
  <rect x="980" y="732" width="540" height="66" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="998" y="757.925" font-size="10.5" fill="#444">PROTOTIPO MILLEFORI: 1 core + converter + RES + overdrive</text>
  <text x="998" y="773.925" font-size="10.5" fill="#444">ascolto (a′) contro (c-B): chiude B1, q. 64 e la voce A17.</text>
  <path d="M 40 836 L 90 836" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="840" font-size="11.5" fill="#333">audio (send → return)</text>
  <path d="M 268 836 L 318 836" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="326" y="840" font-size="11.5" fill="#333">controllo CV / Iabc</text>
  <path d="M 483 836 L 533 836" stroke="#8A4A9E" stroke-width="2.2"/>
  <text x="541" y="840" font-size="11.5" fill="#333">risonanza / nota evidenziata</text>
  <text x="40" y="898" font-size="10.5" fill="#999">Fonte: docs/fase2/filter-module.md (§2-§5ter, §5quater) + sim/filtro/RISULTATI-D5.md + decisioni 80/89/93/99/101/102/109 · 2026-10-14</text>
</svg>
