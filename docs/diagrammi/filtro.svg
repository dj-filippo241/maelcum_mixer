<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
  </defs>
  <rect width="1560" height="900" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MODULO FILTRO GLOBALE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.2 + v0.3-WIP · stile Sherman: 2 sezioni full-range 10 Hz–35 kHz (dec. 74), 8 core mono, risonanza → auto-oscillazione</text>
  <rect x="1145" y="34" width="375" height="24" rx="12" fill="#D97706"/>
  <text x="1332.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">q. 70: carattere (a) OTA vs pulito (c-B) — ascolto</text>
  <rect x="40" y="120" width="200" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="143.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">DAL BACKPLANE</text>
  <text x="140" y="159.55" font-size="10.5" fill="#ddd" text-anchor="middle">4 × send stereo (pre-fader,</text>
  <text x="140" y="175.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ canale) + 2 bit modo</text>
  <text x="140" y="191.55" font-size="10.5" fill="#ddd" text-anchor="middle">0 dBu / +16 worst</text>
  <rect x="300" y="120" width="150" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="375" y="151.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER IN</text>
  <text x="375" y="167.55" font-size="10.5" fill="#444" text-anchor="middle">× 4 sezioni stereo</text>
  <text x="375" y="183.55" font-size="10.5" fill="#444" text-anchor="middle">(CH1…CH4 L/R)</text>
  <rect x="510" y="100" width="330" height="126" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="675" y="136.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">CORE SVF 4 POLI × 8 (mono)</text>
  <text x="675" y="152.05" font-size="10" fill="#444" text-anchor="middle">2 sezioni 2-poli in cascata (Butterworth o</text>
  <text x="675" y="167.55" font-size="10" fill="#444" text-anchor="middle">Bessel/LR — allineamento = q. 64) · HP e LP</text>
  <text x="675" y="183.05" font-size="10" fill="#8A4A9E" text-anchor="middle">(a) OTA LM13700 = carattere (~1 % THD morbido</text>
  <text x="675" y="198.55" font-size="10" fill="#8A4A9E" text-anchor="middle">a 0 dBu) OPPURE (c-B) op-amp + VCA = pulito</text>
  <rect x="900" y="120" width="190" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="995" y="143.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">MUX MODO</text>
  <text x="995" y="159.55" font-size="10.5" fill="#444" text-anchor="middle">HPF / OFF (bypass) / LPF</text>
  <text x="995" y="175.55" font-size="10.5" fill="#444" text-anchor="middle">BBM + ramp 1 ms (dec. 80)</text>
  <text x="995" y="191.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">single-path vs serie = q. 63</text>
  <rect x="1150" y="120" width="170" height="86" rx="6" fill="#F3F2EE" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1235" y="143.55" font-size="13" font-weight="700" fill="#444" text-anchor="middle">DRIVE (per sez.)</text>
  <text x="1235" y="159.55" font-size="10.5" fill="#555" text-anchor="middle">referenza: Sherman</text>
  <text x="1235" y="175.55" font-size="10.5" fill="#555" text-anchor="middle">Filterbox (dec. 82)</text>
  <text x="1235" y="191.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">D5 dopo l'ascolto q. 70</text>
  <rect x="1380" y="120" width="140" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1450" y="151.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">RECOVERY</text>
  <text x="1450" y="167.55" font-size="10.5" fill="#444" text-anchor="middle">low-Z 20-50 Ω</text>
  <text x="1450" y="183.55" font-size="10.5" fill="#444" text-anchor="middle">clean +23 dBu</text>
  <path d="M 240 163 L 298 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 450 163 L 508 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 840 163 L 898 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1090 163 L 1148 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1320 163 L 1378 163" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1450" y="224" font-size="10.5" fill="#C05A1B" text-anchor="middle">→ return canale (0 dBu)</text>
  <rect x="570" y="262" width="300" height="96" rx="6" fill="#F6F1F8" stroke="#8A4A9E" stroke-width="1.5"/>
  <text x="720" y="291.3" font-size="13" font-weight="700" fill="#8A4A9E" text-anchor="middle">RISONANZA (v0.2 SIMULATA)</text>
  <text x="720" y="306.8" font-size="10" fill="#444" text-anchor="middle">iniezione OTA nel summer: 1/Q = Rf·gm_res</text>
  <text x="720" y="322.3" font-size="10" fill="#444" text-anchor="middle">0-90 % corsa = Q 0,707→∞ · 90-100 % = auto-osc.</text>
  <text x="720" y="337.8" font-size="10" fill="#444" text-anchor="middle">+7,3…+8,6 dBu con soft limiter 3 × 1N4148</text>
  <path d="M 720 262 L 720 228" stroke="#8A4A9E" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <rect x="40" y="400" width="1480" height="300" rx="10" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="66" y="432" font-size="15" font-weight="700" fill="#2F6D8E">SEZIONE CONTROLLO — FREQ (2 knob: HPF e LPF, 0-5 V)</text>
  <rect x="66" y="456" width="215" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="173.5" y="481.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">LAW SHAPER</text>
  <text x="173.5" y="497.45" font-size="10" fill="#444" text-anchor="middle">piecewise attivo (dec. 70):</text>
  <text x="173.5" y="512.95" font-size="10" fill="#444" text-anchor="middle">expo 90 % centrale + accelerazione</text>
  <text x="173.5" y="528.45" font-size="10" fill="#444" text-anchor="middle">estremi + pre-distorsione errore</text>
  <rect x="331" y="456" width="235" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="448.5" y="481.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">CONVERTER EXPO</text>
  <text x="448.5" y="497.45" font-size="10" fill="#444" text-anchor="middle">coppia BJT matched, ΔVbe PTAT:</text>
  <text x="448.5" y="512.95" font-size="10" fill="#444" text-anchor="middle">Iabc 114 nA…397 µA = 10,6 Hz…37 kHz</text>
  <text x="448.5" y="528.45" font-size="10" fill="#444" text-anchor="middle">deriva ≤ 2,4 % (0-50 °C)</text>
  <rect x="616" y="456" width="235" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="733.5" y="481.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">DISTRIBUZIONE</text>
  <text x="733.5" y="497.45" font-size="10" fill="#444" text-anchor="middle">mirror bufferizzati × 8 + trim/core</text>
  <text x="733.5" y="512.95" font-size="10" fill="#444" text-anchor="middle">tracking ≤ 1,6 % PASS</text>
  <text x="733.5" y="528.45" font-size="10" fill="#444" text-anchor="middle">(mirror semplice scartato)</text>
  <rect x="901" y="456" width="260" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1031" y="481.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">RAMP BBM (VALIDATA)</text>
  <text x="1031" y="497.45" font-size="10" fill="#444" text-anchor="middle">commutazione modo al picco +18 dBu:</text>
  <text x="1031" y="512.95" font-size="10" fill="#444" text-anchor="middle">τ 1 ms = click −8,4 dB</text>
  <text x="1031" y="528.45" font-size="10" fill="#8A4A9E" text-anchor="middle">famiglia unica 1 ms: ratificata dec. 80</text>
  <rect x="1211" y="456" width="283" height="90" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1352.5" y="481.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">RES + DRIVE CV</text>
  <text x="1352.5" y="497.45" font-size="10" fill="#444" text-anchor="middle">RES: distribuzione a stella bufferizzata</text>
  <text x="1352.5" y="512.95" font-size="10" fill="#444" text-anchor="middle">DRIVE: mux per canale segue il bit modo</text>
  <text x="1352.5" y="528.45" font-size="10" fill="#444" text-anchor="middle">smoothing 1 ms (dec. 80)</text>
  <path d="M 281 501 L 329 501" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 566 501 L 614 501" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 851 501 L 899 501" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 1161 501 L 1209 501" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 733.5 456 L 733.5 382 L 535 382 L 535 228" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="300" y="374" font-size="10" fill="#2F6D8E">Iabc (o Vc se c-B) → integratori dei core</text>
  <rect x="66" y="566" width="1428" height="112" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="84" y="594.2" font-size="12" font-weight="700" fill="#1F7A4D">VERIFICATO CON LM13700 REALE (sim/filtro/RISULTATI-ota-real.md) + RERUN RUMORE 71A</text>
  <text x="84" y="610.2" font-size="10.5" fill="#444">law fc: errore ≤ 1,5 % su 10,6 Hz–37,4 kHz · Q 0,702-0,713 · offset DC stati 4-5 mV bounded (nessun trim)</text>
  <text x="84" y="626.2" font-size="10.5" fill="#444">FINDING: tetto di stato 52 mV a f0 (strutturale per ogni OTA) → il core nudo è un compressore morbido (~1 % THD a 0 dBu, collasso a +10 dBu): è il CARATTERE dell'opzione (a)</text>
  <text x="84" y="642.2" font-size="10.5" fill="#444">RUMORE (dec. 89): target ≤ −80 dBu A-wtd · core ideale −90,3…−126 · die reale stimato −84…−76 a fc max = al limite → è un input in più per la scelta q. 70</text>
  <text x="84" y="658.2" font-size="10.5" fill="#444">i vecchi numeri −107,8…−134,8 dBu sono invalidati (quirk INTEG) · opzione pulita (c-B): VCA 218x × 2 per core (+16 chip)</text>
  <rect x="40" y="722" width="900" height="66" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="747.925" font-size="10.5" fill="#444">RAIL: tutti gli OTA su ±15,0 V ultra-low-noise dal raw ±22 V (pre-reg ±16,5 → LT3045/94, dec. 93) — LM13700 assoluto ±18</text>
  <text x="58" y="763.925" font-size="10.5" fill="#444">BOM v0.1: 20 LM13700 + ~14 quad + 48 diodi limiter + ~30 trimmer + C integratori 33n C0G/PP matched 2 %</text>
  <rect x="980" y="722" width="540" height="66" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="998" y="747.925" font-size="10.5" fill="#444">PROTOTIPO MILLEFORI: 1 core + converter + RES — confronto a ORECCHIO</text>
  <text x="998" y="763.925" font-size="10.5" fill="#444">(a) carattere OTA vs (c-B) pulito; chiude anche le questioni 11 e 64.</text>
  <path d="M 40 826 L 90 826" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="830" font-size="11.5" fill="#333">audio (send → return)</text>
  <path d="M 268 826 L 318 826" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="326" y="830" font-size="11.5" fill="#333">controllo CV / Iabc</text>
  <path d="M 483 826 L 533 826" stroke="#8A4A9E" stroke-width="2.2"/>
  <text x="541" y="830" font-size="11.5" fill="#333">risonanza / aperto su ascolto</text>
  <rect x="760" y="817" width="50" height="18" rx="4" fill="#F3F2EE" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="818" y="830" font-size="11.5" fill="#333">provvisorio / in attesa</text>
  <text x="40" y="878" font-size="10.5" fill="#999">Fonte: docs/fase2/filter-module.md v0.2 + v0.3-WIP (§2-§6, §9) + sim/filtro/RISULTATI-filtro-noise-71A.md + decisioni 80/82/89/93 · core 0 dBu in/out, picco risonanza +6…+10 dBu · 2026-10-12</text>
</svg>
