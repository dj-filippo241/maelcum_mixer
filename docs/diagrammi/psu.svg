  <text x="1115" y="280" font-size="10.5" fill="#777" text-anchor="middle">regolazione nel modulo che usa il rail</text>
  <text x="1400" y="280" font-size="10.5" fill="#777" text-anchor="middle">chi lo usa · corrente</text>
  <rect x="40" y="300" width="390" height="170" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="341.2" font-size="12" font-weight="700" fill="#141414">PROTEZIONI (§4)</text>
  <text x="58" y="357.2" font-size="10.5" fill="#444">1. corto master: auto-limitato 106 mA, nessuna azione</text>
  <text x="58" y="373.2" font-size="10.5" fill="#444">2. corto in un modulo: il regolatore locale limita</text>
  <text x="58" y="389.2" font-size="10.5" fill="#444">   e va in protezione; gli altri moduli non lo vedono</text>
  <text x="58" y="405.2" font-size="10.5" fill="#444">3. fusibili di ramo sul raw: canali T315 · 5-way T630</text>
  <text x="58" y="421.2" font-size="10.5" fill="#444">   FX T400 · filtro T315 · master T500 [PROVV]</text>
  <text x="58" y="437.2" font-size="10.5" fill="#444">+ fusibile secondari + termico del toroidale</text>
  <rect x="40" y="500" width="390" height="170" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="58" y="541.2" font-size="12" font-weight="700" fill="#2F6D8E">SUPERVISOR E MUTE (§3)</text>
  <text x="58" y="557.2" font-size="10.5" fill="#444">comparatori a finestra per avvolgimento (dec. 93)</text>
  <text x="58" y="573.2" font-size="10.5" fill="#444">fuori finestra &gt; 100 ms → mute generale + LED fault</text>
  <text x="58" y="589.2" font-size="10.5" fill="#444">relay di mute failsafe: diseccitati = muto</text>
  <text x="58" y="605.2" font-size="10.5" fill="#444">accensione: relay chiusi dopo 1,5-2 s</text>
  <text x="58" y="621.2" font-size="10.5" fill="#444">spegnimento: il bulk +5 tiene vivo il supervisor</text>
  <text x="58" y="637.2" font-size="10.5" fill="#444">~50 ms → relay aperti senza colpi</text>
  <path d="M 430 585 L 452 585 L 452 688 L 700 688" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="710" y="692" font-size="10.5" fill="#2F6D8E">GLOBAL_MUTE (c9) e relay [H] [B4] [C3] del master</text>
  <rect x="40" y="710" width="1480" height="110" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="745.2" font-size="12" font-weight="700" fill="#141414">CALORE E NUMERI (fanless, dec. 90c)</text>
  <text x="58" y="761.2" font-size="10.5" fill="#444">Regolatori ±18 locali: ~18-21 W distribuiti sui moduli (ognuno ≤ 2,5 W su rame) · pre-regolatori LN ~5 W · stadio HV master: rame ≥ 5 cm² per transistor.</text>
  <text x="58" y="777.2" font-size="10.5" fill="#444">Uscita dei regolatori ±18: 18,00 V, ripple ~7 µVpp stimato al modulo (sim §9a) · hold-up ±18: ~70 ms, più del tempo di rilascio dei relay.</text>
  <text x="58" y="793.2" font-size="10.5" fill="#444">CV dei VCA a 6,1 mV/dB (dec. 92): l'hum sui CV è quantificato (§6), verifica al banco. Da banco: termografia, soglie del supervisor, PSRR reale.</text>
  <path d="M 40 856 L 90 856" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="860" font-size="11.5" fill="#333">potenza / raw</text>
  <path d="M 218 856 L 268 856" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="276" y="860" font-size="11.5" fill="#333">mute e supervisione</text>
  <rect x="433" y="848" width="46" height="16" rx="8" fill="#D97706"/>
  <text x="491" y="860" font-size="11.5" fill="#333">regolazione nel modulo</text>
  <text x="40" y="938" font-size="10.5" fill="#999">Fonte: docs/fase3/sistema-psu.md v0.2 (REV 2026-10-13, §2-§5, §9) + decisioni 54/90/92/93/98/106 + sim/system/psu-*.cir · 2026-10-14</text>
