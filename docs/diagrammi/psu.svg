  <text x="835" y="624.45" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+5 V CONTROL</text>
  <text x="835" y="639.95" font-size="10" fill="#ddd" text-anchor="middle">sul backplane, a stella</text>
