  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">SISTEMA PSU — ALIMENTAZIONE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.2 + REV dec. 98/106 · toroidale unico, regolazione LOCALE in ogni modulo, fanless (dec. 90c) · rail ratificati dec. 93</text>
