  <text x="575" y="547.7" font-size="10" fill="#444" text-anchor="middle">raw 23,3 / 27,1 / 30,3 V</text>
  <rect x="730" y="490" width="210" height="76" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="835" y="524.45" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">RAW ±26 V [M]</text>
  <text x="835" y="539.95" font-size="10" fill="#ddd" text-anchor="middle">sul backplane, a stella</text>
  <rect x="990" y="490" width="250" height="76" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="1115" y="520.925" font-size="10.5" fill="#444" text-anchor="middle">statici dello stadio HV master</text>
  <text x="1115" y="536.925" font-size="10.5" fill="#444" text-anchor="middle">+ LDO locali del master</text>
  <rect x="1280" y="490" width="240" height="76" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1400" y="513.25" font-size="10" fill="#444" text-anchor="middle">solo master out: +24 dBu reali</text>
  <text x="1400" y="528.75" font-size="10" fill="#444" text-anchor="middle">(+25,1 dBu a rete −10 %, Test 17)</text>
  <text x="1400" y="544.25" font-size="10" fill="#8A4A9E" text-anchor="middle">~130-170 mA</text>
