  <rect x="470" y="490" width="190" height="76" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="565" y="516.7" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">W3 2×20 V 0,4 A</text>
  <text x="565" y="532.2" font-size="10" fill="#444" text-anchor="middle">ponte + bulk 2 × 4,7 mF</text>
  <text x="565" y="547.7" font-size="10" fill="#444" text-anchor="middle">T630 mA</text>
  <rect x="690" y="490" width="200" height="76" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="790" y="516.7" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">RAW ±27 V [M]</text>
  <text x="790" y="532.2" font-size="10" fill="#ddd" text-anchor="middle">non regolato nel box</text>
  <text x="790" y="547.7" font-size="10" fill="#ddd" text-anchor="middle">30,3 V a rete +10 %</text>
  <rect x="965" y="490" width="260" height="76" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="1095" y="521" font-size="10" fill="#444" text-anchor="middle">PSU-IN: TVS · T500 mA · 1 mF</text>
  <text x="1095" y="536.5" font-size="10" fill="#444" text-anchor="middle">master: statici HV + LDO locali</text>
  <rect x="1255" y="490" width="270" height="76" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1390" y="521" font-size="10" fill="#444" text-anchor="middle">solo master out: +24 dBu reali</text>
  <text x="1390" y="536.5" font-size="10" fill="#8A4A9E" text-anchor="middle">~130-170 mA</text>
  <path d="M 565 476 L 565 488" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 660 528 L 688 528" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 890 528 L 963 528" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1225 528 L 1253 528" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="470" y="590" width="190" height="76" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="565" y="616.7" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">W4 9 V 2,5 A</text>
  <text x="565" y="632.2" font-size="10" fill="#444" text-anchor="middle">ponte + bulk 10 mF</text>
  <text x="565" y="647.7" font-size="10" fill="#444" text-anchor="middle">T3,15 A</text>
  <rect x="690" y="590" width="200" height="76" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="790" y="616.7" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">+5 V E V_FAN</text>
  <text x="790" y="632.2" font-size="10" fill="#ddd" text-anchor="middle">+5: LM1084/LM2940 nel box</text>
  <text x="790" y="647.7" font-size="10" fill="#ddd" text-anchor="middle">V_FAN: raw W4 non regolato</text>
  <rect x="965" y="590" width="260" height="76" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="1095" y="621" font-size="10" fill="#444" text-anchor="middle">PSU-IN: TVS · T2 A · 1 mF sul +5</text>
  <text x="1095" y="636.5" font-size="10" fill="#444" text-anchor="middle">V_FAN: T500 mA → driver ventole</text>
  <rect x="1255" y="590" width="270" height="76" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1390" y="613.25" font-size="10" fill="#444" text-anchor="middle">LED dei meter · logiche · relè</text>
  <text x="1390" y="628.75" font-size="10" fill="#444" text-anchor="middle">supervisor · 2 ventole</text>
  <text x="1390" y="644.25" font-size="10" fill="#8A4A9E" text-anchor="middle">+5 worst 1,3 A · ventole 0,3 A</text>
  <path d="M 565 576 L 565 588" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 660 628 L 688 628" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 890 628 L 963 628" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1225 628 L 1253 628" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="40" y="290" width="390" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="334.2" font-size="12" font-weight="700" fill="#141414">PROTEZIONI (§2.7, §4.3)</text>
  <text x="58" y="350.2" font-size="10.5" fill="#444">rete: interruttore bipolare · T2 A · NTC + relè di bypass</text>
  <text x="58" y="366.2" font-size="10.5" fill="#444">secondari: fusibili lenti prima dei ponti</text>
  <text x="58" y="382.2" font-size="10.5" fill="#444">   (T5 A · T1,25 A · T630 mA · T3,15 A) · termico</text>
  <text x="58" y="398.2" font-size="10.5" fill="#444">uscite: limite di corrente degli LDO (corto nel cavo)</text>
  <text x="58" y="414.2" font-size="10.5" fill="#444">nel mixer: TVS + fusibile di gruppo per rail (PSU-IN)</text>
  <text x="58" y="430.2" font-size="10.5" fill="#444">   + PTC per slot e per rail sul backplane [PROVV]</text>
  <rect x="40" y="490" width="390" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="534.2" font-size="12" font-weight="700" fill="#141414">TERRA E 0 V (§3, §4.2)</text>
  <text x="58" y="550.2" font-size="10.5" fill="#444">terra di rete → telaio del box</text>
  <text x="58" y="566.2" font-size="10.5" fill="#444">→ conduttore PE dedicato (chiude per primo) + schermo</text>
  <text x="58" y="582.2" font-size="10.5" fill="#444">→ telaio del mixer</text>
  <text x="58" y="598.2" font-size="10.5" fill="#444">nel box gli 0 V non toccano la terra: ogni 0 V</text>
  <text x="58" y="614.2" font-size="10.5" fill="#444">viaggia separato fino alla stella nel PSU-IN</text>
  <text x="58" y="630.2" font-size="10.5" fill="#444">(unico bond telaio ↔ AGND, sistema-grounding §2)</text>
  <rect x="40" y="700" width="850" height="80" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="465" y="728.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">RIVELATORE AC_OK (§2.5, §2.6)</text>
  <text x="465" y="744.2" font-size="10.5" fill="#444" text-anchor="middle">doppia semionda dal W1 · τ 42,7 ms · soglia al 75 % del picco · open-collector, alto = rete presente</text>
  <text x="465" y="760.2" font-size="10.5" fill="#444" text-anchor="middle">scatta in ≤ 12,7-21,4 ms, prima che i regolatori locali escano (≥ 25,9 ms) · anche sotto ~−21 % di rete</text>
  <rect x="965" y="690" width="270" height="176" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="983" y="727.95" font-size="12" font-weight="700" fill="#2F6D8E">SUPERVISOR E MUTE (§4.4)</text>
  <text x="983" y="743.45" font-size="10" fill="#444">vive sul +5 del box, sente i rail regolati</text>
  <text x="983" y="758.95" font-size="10" fill="#444">±22 &lt; 21,2 / &gt; 23,5 V · ±19 &lt; 18,3 / &gt; 20,5</text>
  <text x="983" y="774.45" font-size="10" fill="#444">[M] &lt; 22,0 V (5 ms) · +5 &lt; 4,6 / &gt; 5,5 V</text>
  <text x="983" y="789.95" font-size="10" fill="#444">AC_OK basso → mute subito (filtro 1 ms)</text>
  <text x="983" y="805.45" font-size="10" fill="#444">riarmo 1,5-2 s dopo il rientro</text>
  <text x="983" y="820.95" font-size="10" fill="#444">cavo staccato = relè rilasciati, niente pop</text>
  <text x="983" y="836.45" font-size="10" fill="#444">→ GLOBAL_MUTE (c9) + relè del master</text>
  <path d="M 890 740 L 963 740" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="1255" y="690" width="270" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1273" y="735.7" font-size="12" font-weight="700" fill="#141414">VENTOLE E CALORE (§4.5, §5)</text>
  <text x="1273" y="751.2" font-size="10" fill="#444">2 ventole: NTC sulla barra dei regolatori ±18</text>
  <text x="1273" y="766.7" font-size="10" fill="#444">driver lineare da V_FAN, niente PWM</text>
  <text x="1273" y="782.2" font-size="10" fill="#444">spente &lt; 35 °C · ~6 V a 35 °C · max a 50 °C</text>
  <text x="1273" y="797.7" font-size="10" fill="#444">ventola ferma &gt; 45 °C → LED guasto, no mute</text>
  <text x="1273" y="813.2" font-size="10" fill="#444">calore nel mixer ~83 W · ~97 W con opzionali</text>
  <text x="1273" y="828.7" font-size="10" fill="#444">aria interna ~+3 K sopra l'ambiente</text>
  <path d="M 40 910 L 90 910" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="914" font-size="11.5" fill="#333">potenza (rail)</text>
  <path d="M 224 910 L 274 910" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="282" y="914" font-size="11.5" fill="#333">mute e supervisione</text>
  <rect x="439" y="902" width="46" height="16" rx="8" fill="#D97706"/>
  <text x="497" y="914" font-size="11.5" fill="#333">regolazione nel mixer</text>
  <rect x="667" y="901" width="50" height="18" rx="4" fill="#F3F2EE" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="725" y="914" font-size="11.5" fill="#333">contenitore</text>
  <text x="40" y="938" font-size="10.5" fill="#999">Fonte: docs/fase3/sistema-psu-esterno.md v0.1 (§1-§5) + sistema-psu.md REV dec. 113 + decisioni 90/93/106/111/112/113/115 + sim/system/psu-*.cir · 2026-10-21</text>
