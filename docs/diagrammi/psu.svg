  <rect width="1560" height="960" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">SISTEMA PSU — ALIMENTAZIONE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — alimentatore ESTERNO con pre-regolatori (dec. 113) · regolazione finale nei moduli (dec. 93) · 2 ventole a termostato (dec. 112)</text>
  <rect x="1277" y="34" width="243" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1398.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">box esterno · toroidale ~270 VA</text>
  <rect x="20" y="88" width="885" height="792" rx="10" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="32" y="104" font-size="11" font-weight="700" fill="#555">BOX ESTERNO (dec. 113) — vicino al banco, a terra su piedini</text>
  <rect x="950" y="88" width="590" height="792" rx="10" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="962" y="104" font-size="11" font-weight="700" fill="#555">MIXER — modulo PSU-IN e regolazione nei moduli</text>
  <rect x="40" y="130" width="150" height="90" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="115" y="163.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">RETE 230 V</text>
  <text x="115" y="179.55" font-size="10.5" fill="#ddd" text-anchor="middle">IEC + filtro EMC</text>
  <text x="115" y="195.55" font-size="10.5" fill="#ddd" text-anchor="middle">interruttore bipolare</text>
  <rect x="220" y="120" width="210" height="110" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="325" y="155.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">INGRESSO RETE</text>
  <text x="325" y="171.55" font-size="10.5" fill="#444" text-anchor="middle">fusibile T2 A [PROVV]</text>
  <text x="325" y="187.55" font-size="10.5" fill="#444" text-anchor="middle">NTC 10-20 Ω anti-inrush</text>
  <text x="325" y="203.55" font-size="10.5" fill="#444" text-anchor="middle">+ relè di bypass dopo 0,5 s</text>
  <rect x="470" y="110" width="190" height="130" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="565" y="147.55" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">TOROIDALE ~270 VA</text>
  <text x="565" y="163.55" font-size="10.5" fill="#444" text-anchor="middle">unico, 4 secondari</text>
  <text x="565" y="179.55" font-size="10.5" fill="#444" text-anchor="middle">schermo primario/secondari</text>
  <text x="565" y="195.55" font-size="10.5" fill="#444" text-anchor="middle">termico integrato</text>
  <text x="565" y="211.55" font-size="10.5" fill="#444" text-anchor="middle">(dec. 106/111/115)</text>
  <path d="M 190 175 L 218 175" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 430 175 L 468 175" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="690" y="110" width="200" height="130" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="790" y="148.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">CALORE NEL BOX (§2.8)</text>
  <text x="790" y="163.7" font-size="10" fill="#444" text-anchor="middle">~48 W · ~63 W a rete +10 %</text>
  <text x="790" y="179.2" font-size="10" fill="#444" text-anchor="middle">aletta Rθ ≤ 0,6 K/W</text>
  <text x="790" y="194.7" font-size="10" fill="#444" text-anchor="middle">senza ventola</text>
  <text x="790" y="210.2" font-size="10" fill="#444" text-anchor="middle">chiuso: pioggia e polvere</text>
  <rect x="965" y="110" width="560" height="130" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1245" y="155.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">CAVO ≤ 2 m E CONNETTORE (§3)</text>
  <text x="1245" y="171.2" font-size="10.5" fill="#444" text-anchor="middle">20 conduttori da 0,5 mm² + schermo · circolare metallico a vite, IP65, classe 24 poli</text>
  <text x="1245" y="187.2" font-size="10.5" fill="#444" text-anchor="middle">±22 audio 2+2 · ±19 LN 1+1 · ±27 [M] 1+1 · +5 2 · V_FAN 1+1 · AC_OK 1 · PE 1</text>
  <text x="1245" y="203.2" font-size="10.5" fill="#444" text-anchor="middle">ogni 0 V su conduttori propri fino alla stella · cadute ≤ 60 mV · marca: voce 40</text>
  <text x="790" y="280" font-size="10.5" fill="#777" text-anchor="middle">pre-regolazione nel box</text>
  <text x="1095" y="280" font-size="10.5" fill="#777" text-anchor="middle">nel mixer: PSU-IN e modulo</text>
  <text x="1390" y="280" font-size="10.5" fill="#777" text-anchor="middle">chi lo usa · corrente</text>
  <path d="M 565 240 L 565 576" stroke="#C05A1B" stroke-width="2.5" fill="none"/>
  <rect x="470" y="290" width="190" height="76" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="565" y="316.7" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">W1 2×21 V 4,0 A</text>
  <text x="565" y="332.2" font-size="10" fill="#444" text-anchor="middle">ponte + bulk 2 × 15 mF</text>
  <text x="565" y="347.7" font-size="10" fill="#444" text-anchor="middle">T5 A per ramo</text>
  <rect x="690" y="290" width="200" height="76" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="790" y="316.7" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">LDO MOSFET ±22,0 V</text>
  <text x="790" y="332.2" font-size="10" fill="#ddd" text-anchor="middle">limite 2,7 A · soft-start 0,3 s</text>
  <text x="790" y="347.7" font-size="10" fill="#ddd" text-anchor="middle">ripple al mixer ≤ 3 mV pp</text>
  <rect x="965" y="290" width="260" height="76" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="1095" y="321" font-size="10" fill="#444" text-anchor="middle">PSU-IN: TVS · T2,5 A · 2,2 mF</text>
  <text x="1095" y="336.5" font-size="10" fill="#444" text-anchor="middle">modulo: LM317/337 → 19,2 V + cap mult. → ±18</text>
  <rect x="1255" y="290" width="270" height="76" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1390" y="313.25" font-size="10" fill="#444" text-anchor="middle">canali · 5-way · FX · filtro · FX-SEND</text>
  <text x="1390" y="328.75" font-size="10" fill="#444" text-anchor="middle">CUE · mic/mono · moduli opzionali</text>
  <text x="1390" y="344.25" font-size="10" fill="#8A4A9E" text-anchor="middle">~1,5 A base · ~1,8 A con gli opzionali</text>
  <path d="M 565 276 L 565 288" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
