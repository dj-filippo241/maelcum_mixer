  <rect x="470" y="390" width="190" height="76" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="565" y="416.7" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">W2 2×18 V 1,0 A</text>
  <text x="565" y="432.2" font-size="10" fill="#444" text-anchor="middle">ponte + bulk 2 × 10 mF</text>
  <text x="565" y="447.7" font-size="10" fill="#444" text-anchor="middle">T1,25 A</text>
  <rect x="690" y="390" width="200" height="76" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="790" y="416.7" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">LDO MOSFET ±19 V</text>
  <text x="790" y="432.2" font-size="10" fill="#ddd" text-anchor="middle">limite 1,1 A</text>
  <text x="790" y="447.7" font-size="10" fill="#ddd" text-anchor="middle">ripple al mixer ≤ 1 mV pp</text>
  <rect x="965" y="390" width="260" height="76" rx="6" fill="#FDF4EA" stroke="#D97706" stroke-width="1.2"/>
  <text x="1095" y="413.25" font-size="10" fill="#444" text-anchor="middle">PSU-IN: TVS · T1 A · 1 mF</text>
  <text x="1095" y="428.75" font-size="10" fill="#444" text-anchor="middle">modulo: pre-reg ±16,5 → LT3045/94 → ±15,0</text>
  <text x="1095" y="444.25" font-size="10" fill="#444" text-anchor="middle">+ 78L15/79L15 ±15 per gli switch</text>
  <rect x="1255" y="390" width="270" height="76" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1390" y="413.25" font-size="10" fill="#444" text-anchor="middle">phono · mic · CV · meter · CUE</text>
  <text x="1390" y="428.75" font-size="10" fill="#444" text-anchor="middle">OTA filtro · switch kill/assign</text>
  <text x="1390" y="444.25" font-size="10" fill="#8A4A9E" text-anchor="middle">picco LN ~0,48 A</text>
  <path d="M 565 376 L 565 388" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 660 428 L 688 428" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
