<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="960" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">SISTEMA METERING — BARRE LED A ZONE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design S4 v0.1 · ballistica Pioneer DJM (dec. 81) · soglie assolute (dec. 90): fondo scala +24 dBu uguale su ogni barra</text>
  <rect x="1339" y="34" width="181" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1429.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">8 barre + LED mic/mono</text>
  <text x="40" y="122" font-size="13" font-weight="700" fill="#141414">PUNTI DI PRESA (SPECIFICA §11, bloccati)</text>
  <rect x="40" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="175" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">MASTER L/R</text>
  <text x="175" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post master level,</text>
  <text x="175" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">pre stadio HV</text>
  <text x="175" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">2 barre da 20 segm.</text>
  <rect x="340" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="475" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">DJ × 4</text>
  <text x="475" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post filtro/overdrive,</text>
  <text x="475" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">pre-fader</text>
  <text x="475" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">4 barre da 10 segm.</text>
  <rect x="640" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="775" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5-WAY</text>
  <text x="775" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post drive, pre</text>
  <text x="775" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">master sum (g × 2)</text>
  <text x="775" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">1 barra da 10 segm.</text>
  <rect x="940" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1075" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">RITORNO FX</text>
  <text x="1075" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post gain/EQ2,</text>
  <text x="1075" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">pre-fader</text>
  <text x="1075" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">1 barra da 10 segm.</text>
  <rect x="1240" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1375" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">MIC / MONO</text>
  <text x="1375" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">dopo il preamp,</text>
  <text x="1375" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">prima dell'EQ2</text>
  <text x="1375" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">solo LED tricolore</text>
  <text x="40" y="268" font-size="13" font-weight="700" fill="#141414">CATENA PER BARRA (§2) — una per ogni barra, detector su ±15 V LN</text>
  <rect x="40" y="284" width="220" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="150" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">INGRESSO</text>
  <text x="150" y="328.45" font-size="10" fill="#444" text-anchor="middle">guadagno g + trim ±2 %</text>
  <text x="150" y="343.95" font-size="10" fill="#444" text-anchor="middle">(calibrazione per zona)</text>
  <text x="150" y="359.45" font-size="10" fill="#444" text-anchor="middle">buffer OPA1612</text>
  <rect x="300" y="284" width="220" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="410" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">SUPERDIODO</text>
  <text x="410" y="328.45" font-size="10" fill="#444" text-anchor="middle">OPA + 1N4148</text>
  <text x="410" y="343.95" font-size="10" fill="#444" text-anchor="middle">clamp anti-windup −1,5 V</text>
  <text x="410" y="359.45" font-size="10" fill="#444" text-anchor="middle">attacco 0,23 ms</text>
  <rect x="560" y="284" width="220" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="670" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">HOLD + RELEASE</text>
  <text x="670" y="328.45" font-size="10" fill="#444" text-anchor="middle">C 100 nF da solo sul nodo</text>
  <text x="670" y="343.95" font-size="10" fill="#444" text-anchor="middle">R 2M + trimmer 3,3M</text>
  <text x="670" y="359.45" font-size="10" fill="#444" text-anchor="middle">τ 0,2…0,53 s (0,3 tipico)</text>
  <rect x="820" y="284" width="200" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="920" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">BUFFER</text>
  <text x="920" y="328.45" font-size="10" fill="#444" text-anchor="middle">hold al picco +24,00 dBu</text>
  <text x="920" y="343.95" font-size="10" fill="#444" text-anchor="middle">droop −2,9 dB/ciclo</text>
  <text x="920" y="359.45" font-size="10" fill="#444" text-anchor="middle">a 10 Hz (dec. 81)</text>
  <rect x="1060" y="254" width="220" height="76" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="1170" y="280.7" font-size="12" font-weight="700" fill="#1F7A4D" text-anchor="middle">LM3915 (scala)</text>
  <text x="1170" y="296.2" font-size="10" fill="#444" text-anchor="middle">10 segm. × 3 dB · master:</text>
  <text x="1170" y="311.7" font-size="10" fill="#444" text-anchor="middle">2 chip in cascata = 20</text>
  <rect x="1060" y="354" width="220" height="76" rx="6" fill="#F6F1F8" stroke="#8A4A9E" stroke-width="1.5"/>
  <text x="1170" y="380.7" font-size="12" font-weight="700" fill="#8A4A9E" text-anchor="middle">PURPLE (clip latch)</text>
  <text x="1170" y="396.2" font-size="10" fill="#444" text-anchor="middle">LM339 a +23 dBu</text>
  <text x="1170" y="411.7" font-size="10" fill="#444" text-anchor="middle">one-shot 0,7 s → 479 ms</text>
  <path d="M 260 332 L 298 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 520 332 L 558 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 780 332 L 818 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1020 332 L 1040 332 L 1040 292 L 1058 292" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1040 332 L 1040 392 L 1058 392" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <circle cx="1040" cy="332" r="5" fill="#C05A1B"/>
  <rect x="1320" y="254" width="200" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1420" y="291.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">LED</text>
  <text x="1420" y="307.45" font-size="10" fill="#444" text-anchor="middle">LM3915 sul +5 V control</text>
  <text x="1420" y="322.95" font-size="10" fill="#444" text-anchor="middle">(LED isolati dal rail LN)</text>
  <text x="1420" y="338.45" font-size="10" fill="#444" text-anchor="middle">2-5 mA per segmento</text>
  <text x="1420" y="353.95" font-size="10" fill="#444" text-anchor="middle">worst ~0,5 A su +5 V</text>
  <text x="1420" y="369.45" font-size="10" fill="#444" text-anchor="middle"></text>
  <text x="1420" y="384.95" font-size="10" fill="#444" text-anchor="middle">master purple: sensing</text>
  <text x="1420" y="400.45" font-size="10" fill="#444" text-anchor="middle">dello stadio HV [aperto]</text>
  <path d="M 1280 292 L 1318 292" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1280 392 L 1318 392" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="40" y="470" font-size="13" font-weight="700" fill="#141414">SCALA E COLORI (§3) — soglie dec. 90 rispettate, split giallo/ambra a +12 [PROVV]</text>
  <rect x="40" y="490" width="236" height="40" rx="6" fill="#3B6FB6"/>
  <text x="158" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">BLU</text>
  <text x="158" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">&lt; −6 dBu</text>
  <text x="158" y="568" font-size="10.5" fill="#666" text-anchor="middle">solo master (9 segm.)</text>
  <rect x="288" y="490" width="236" height="40" rx="6" fill="#2E9E4F"/>
  <text x="406" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">VERDE</text>
  <text x="406" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">−6 … +6</text>
  <text x="406" y="568" font-size="10.5" fill="#666" text-anchor="middle">programma attorno a 0</text>
  <rect x="536" y="490" width="236" height="40" rx="6" fill="#E3C21B"/>
  <text x="654" y="515" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">GIALLO</text>
  <text x="654" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">+6 … +12</text>
  <text x="654" y="568" font-size="10.5" fill="#666" text-anchor="middle">forte</text>
  <rect x="784" y="490" width="236" height="40" rx="6" fill="#E88A1A"/>
  <text x="902" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">AMBRA</text>
  <text x="902" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">+12 … +18</text>
  <text x="902" y="568" font-size="10.5" fill="#666" text-anchor="middle">molto forte</text>
  <rect x="1032" y="490" width="236" height="40" rx="6" fill="#D2322D"/>
  <text x="1150" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">ROSSO</text>
  <text x="1150" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">+18 … +24</text>
  <text x="1150" y="568" font-size="10.5" fill="#666" text-anchor="middle">estremo</text>
  <rect x="1280" y="490" width="236" height="40" rx="6" fill="#8A4A9E"/>
  <text x="1398" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">VIOLA</text>
  <text x="1398" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">≥ +23 latch</text>
  <text x="1398" y="568" font-size="10.5" fill="#666" text-anchor="middle">clip, LED dedicato</text>
  <text x="40" y="598" font-size="11" fill="#444">Zone a 10 segmenti: +24 … −3 dBu (sotto −3 la barra è spenta). Master a 20 segmenti: +24 … −33 dBu.</text>
  <rect x="40" y="630" width="720" height="110" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="58" y="657.2" font-size="12" font-weight="700" fill="#2F6D8E">ALBERO DEI RIFERIMENTI CONDIVISO (§5)</text>
  <text x="58" y="673.2" font-size="10.5" fill="#444">+15 V LN → partitore 10k/5k 0,1 % → follower → vrefA 5,000 V = fondo scala +24 dBu (tutte le barre)</text>
  <text x="58" y="689.2" font-size="10.5" fill="#444">→ partitore 10k/4,625k 0,1 % → follower → vrefB 1,581 V (secondo chip delle cascate master)</text>
  <text x="58" y="705.2" font-size="10.5" fill="#8A4A9E">follower obbligatori: il partitore nudo caricato scendeva a 4,07 V (finding sim)</text>
  <text x="58" y="721.2" font-size="10.5" fill="#444">calibrazione identica per costruzione: errore ≤ ±0,012 dB</text>
  <rect x="800" y="630" width="720" height="110" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="818" y="665.2" font-size="12" font-weight="700" fill="#141414">MIC / MONO: UN LED TRICOLORE (dec. 97)</text>
  <text x="818" y="681.2" font-size="10.5" fill="#444">verde = segnale ok (≥ −6 dBu) · giallo = vicino al clip (≥ +11) · rosso = clip (≥ +17, latch)</text>
  <text x="818" y="697.2" font-size="10.5" fill="#444">rosso a +17 e non +23: il front-end mic su ±15 V clippa prima, e l'EQ2 aggiunge fino a +6</text>
  <text x="818" y="713.2" font-size="10.5" fill="#444">soglie [PROVVISORIO] · comparatori LM339 condivisi col purple delle zone</text>
  <rect x="40" y="770" width="1480" height="92" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="796.2" font-size="12" font-weight="700" fill="#141414">BOM E APERTI</text>
  <text x="58" y="812.2" font-size="10.5" fill="#444">BOM di massima: 10 LM3915 · ~12 OPA1612 · 2 LM339 · ~103 LED + 8 purple · ~50-80 € [molto PROVVISORIA]. Alternativa a LM3915: ladder di LM339 (10× i chip).</text>
  <text x="58" y="828.2" font-size="10.5" fill="#444">Niente meter su booth, rec, cuffie e mandate (SPECIFICA §11). Aperti (voce 40 / q54): posizione delle barre, 10 o 20 segmenti per zona,</text>
  <text x="58" y="844.2" font-size="10.5" fill="#444">luminosità 2 o 5 mA, purple del master a doppio criterio o uno solo, procedura di calibrazione con toni a livelli noti.</text>
  <path d="M 40 892 L 90 892" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="896" font-size="11.5" fill="#333">segnale</text>
  <path d="M 181 892 L 231 892" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="239" y="896" font-size="11.5" fill="#333">riferimenti / logica</text>
  <text x="40" y="938" font-size="10.5" fill="#999">Fonte: docs/fase3/sistema-metering.md v0.1 (§1-§9) + sim/system/meter-*.cir + sim/meter/RISULTATI-peak-det.md + decisioni 81/90/97 · 2026-10-14</text>
</svg>
