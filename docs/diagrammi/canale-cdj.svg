  <text x="1135" y="552.7" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">LOGICA DEL DIP (dec. 163)</text>
  <text x="1135" y="568.2" font-size="10" fill="#444" text-anchor="middle">74HC86 + 74HC14 + 74HC74, antirimbalzo RC</text>
  <text x="1135" y="583.7" font-size="10" fill="#444" text-anchor="middle">2 celle RC 10k/50n + buffer → EC− dei VCA</text>
  <text x="1135" y="599.2" font-size="10" fill="#444" text-anchor="middle">VCA giù a −100 dB in ~1 ms,</text>
  <text x="1135" y="614.7" font-size="10" fill="#444" text-anchor="middle">ADG commuta a ~1,6 ms, su in ~3 ms</text>
  <text x="1135" y="630.2" font-size="10" fill="#8A4A9E" text-anchor="middle">all'orecchio: respiro di 3-4 ms, niente click</text>
  <text x="1135" y="645.7" font-size="10" fill="#444" text-anchor="middle">CUE, send e meter non lo vedono</text>
