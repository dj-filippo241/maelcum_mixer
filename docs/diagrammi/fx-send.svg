<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="720" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MICRO-MODULO FX-SEND (×4, uno per canale)</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.1-WIP + PCB v0.2 (dec. 91a, 133-136): EQ2 + level + assign fuori dal canale CDJ · 4× stesso PCB · metà L; R identica</text>
  <rect x="1370" y="34" width="150" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1445" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">PCB v0.2 PASSA</text>
  <rect x="40" y="170" width="195" height="96" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="137.5" y="198.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">SEND TAP L/R</text>
  <text x="137.5" y="214.55" font-size="10.5" fill="#ddd" text-anchor="middle">dal canale CDJ, blocco [E]</text>
  <text x="137.5" y="230.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ, pre-filtro, pre-fader</text>
  <text x="137.5" y="246.55" font-size="10.5" fill="#ddd" text-anchor="middle">backplane slot 3 del canale</text>
  <rect x="275" y="178" width="150" height="80" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="206.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER IN</text>
  <text x="350" y="222.55" font-size="10.5" fill="#444" text-anchor="middle">OPA1612 unity</text>
  <text x="350" y="238.55" font-size="10.5" fill="#444" text-anchor="middle">isola il driver di canale</text>
  <rect x="465" y="160" width="240" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="585" y="191.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">EQ2 — celle serie</text>
  <text x="585" y="207.05" font-size="10" fill="#444" text-anchor="middle">LOW shelf ~120 Hz (Baxandall,</text>
  <text x="585" y="222.55" font-size="10" fill="#444" text-anchor="middle">un pot doppio 10k per la cella)</text>
  <text x="585" y="238.05" font-size="10" fill="#444" text-anchor="middle">HIGH sottrattiva ~4,5 kHz (q. 68)</text>
  <text x="585" y="253.55" font-size="10" fill="#444" text-anchor="middle">−∞ → 0 → +6 · pot lineare + R (129 A3)</text>
  <rect x="745" y="170" width="185" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="837.5" y="198.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">LEVEL</text>
  <text x="837.5" y="214.55" font-size="10.5" fill="#444" text-anchor="middle">pot doppio 10k log A</text>
  <text x="837.5" y="230.55" font-size="10.5" fill="#444" text-anchor="middle">−20 dB a metà, mai gain &gt; 0</text>
  <text x="837.5" y="246.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">unico livello al pedale (108)</text>
  <rect x="970" y="160" width="230" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1085" y="191.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER DI INIEZIONE</text>
  <text x="1085" y="207.05" font-size="10" fill="#444" text-anchor="middle">OPA1654 quad × 2 (unity)</text>
  <text x="1085" y="222.55" font-size="10" fill="#444" text-anchor="middle">8 sezioni: S1-S4 × L/R</text>
  <text x="1085" y="238.05" font-size="10" fill="#444" text-anchor="middle">+ R 10k di iniezione per linea</text>
  <text x="1085" y="253.55" font-size="10" fill="#8A4A9E" text-anchor="middle">[PROVV] 1 buffer per lato: stesso rumore</text>
  <rect x="1240" y="160" width="280" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1380" y="191.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">ASSIGN × 4 (S1-S4)</text>
  <text x="1380" y="207.05" font-size="10" fill="#444" text-anchor="middle">π SPDT ADG1434 DOPO la R 10k:</text>
  <text x="1380" y="222.55" font-size="10" fill="#444" text-anchor="middle">sul nodo a massa virtuale del bus</text>
  <text x="1380" y="238.05" font-size="10" fill="#444" text-anchor="middle">(vede ~8 mV: niente clip a +22 dBu)</text>
  <text x="1380" y="253.55" font-size="10" fill="#444" text-anchor="middle">multipli e simultanei [BLOCCATO]</text>
  <path d="M 235 218 L 273 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 425 218 L 463 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 705 218 L 743 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 930 218 L 968 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1200 218 L 1238 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="1240" y="340" width="280" height="70" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1380" y="363.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">→ BUS FX 1-4 (net S1-S4)</text>
  <text x="1380" y="379.55" font-size="10.5" fill="#ddd" text-anchor="middle">summing virtual-earth dei FX-RET</text>
  <text x="1380" y="395.55" font-size="10.5" fill="#ddd" text-anchor="middle">net multidrop, come il DJ bus</text>
  <path d="M 1380 276 L 1380 338" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="640" y="350" width="260" height="92" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="770" y="376.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">BOTTONI ASSIGN S1-S4</text>
  <text x="770" y="392.2" font-size="10.5" fill="#444" text-anchor="middle">sul pannello del CANALE, con luce</text>
  <text x="770" y="408.2" font-size="10.5" fill="#444" text-anchor="middle">a ritenuta (dec. 123) · +5 V su cavo</text>
  <text x="770" y="424.2" font-size="10.5" fill="#444" text-anchor="middle">l'audio non passa mai dai contatti</text>
  <rect x="935" y="340" width="245" height="112" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1057.5" y="369.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">TAGLIO ALLO ZERO (todo 224)</text>
  <text x="1057.5" y="384.7" font-size="10" fill="#444" text-anchor="middle">1 comparatore per lato + 74HC74</text>
  <text x="1057.5" y="400.2" font-size="10" fill="#444" text-anchor="middle">bottone → D, clock dal comparatore</text>
  <text x="1057.5" y="415.7" font-size="10" fill="#8A4A9E" text-anchor="middle">gradino −51/−54 dB, ritardo 20-80 µs</text>
  <text x="1057.5" y="431.2" font-size="10" fill="#444" text-anchor="middle">(il pin IN è logico: un RC non fa rampa)</text>
  <path d="M 900 396 L 933 396" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 1180 396 L 1205 396 L 1205 300 L 1262 300 L 1262 278" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="1240" y="480" width="280" height="70" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1380" y="503.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">GLOBAL_MUTE (linea c9)</text>
  <text x="1380" y="519.2" font-size="10.5" fill="#444" text-anchor="middle">dal mute controller [L] del master</text>
  <text x="1380" y="535.2" font-size="10.5" fill="#444" text-anchor="middle">muta i buffer d'iniezione (dec. 94b)</text>
  <path d="M 1240 515 L 918 515 L 918 300 L 1060 300 L 1060 278" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="40" y="340" width="560" height="210" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="391.8" font-size="13" font-weight="700" fill="#141414">PERCHÉ UN MICRO-MODULO</text>
  <text x="58" y="408.3" font-size="11" fill="#444">Il canale CDJ resta più semplice: gli resta solo il SEND TAP.</text>
  <text x="58" y="424.8" font-size="11" fill="#444">Comportamenti LOCKED invariati (SPECIFICA §2): punto di presa,</text>
  <text x="58" y="441.3" font-size="11" fill="#444">bande e law dell'EQ2, level senza gain, assign multipli.</text>
  <text x="58" y="457.8" font-size="11" fill="#444">Rumore (todo 184): un send assegnato −101,7 dBu A al bus</text>
  <text x="58" y="474.3" font-size="11" fill="#444">a LEVEL max, floor −111,2. Sistema con 4 send al massimo</text>
  <text x="58" y="490.8" font-size="11" fill="#444">su ogni bus: −81,8 dBu A, PASS: la deroga della dec. 95 non serve.</text>
  <text x="58" y="507.3" font-size="11" fill="#444">Pot su scheda comandi dietro il pannello, cavo 2×12 (dec. 136).</text>
  <path d="M 40 610 L 90 610" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="614" font-size="11.5" fill="#333">audio</text>
  <path d="M 169 610 L 219 610" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="227" y="614" font-size="11.5" fill="#333">comando: logiche +5 V / mute</text>
  <text x="40" y="698" font-size="10.5" fill="#999">Fonte: docs/fase1/fx-send-module.md (§2 REV 2026-11-03, §3-§6) + sim/fx/RISULTATI-fx-send-assign.md + RISULTATI-send-chain-v2.md + pcb/fx-send/NOTE.md + decisioni 91/94b/108/123/136 · 2026-11-04</text>
</svg>
