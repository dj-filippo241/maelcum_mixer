<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
  </defs>
  <rect width="1560" height="700" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MICRO-MODULO FX-SEND (×4, uno per canale)</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.1-WIP (dec. 91a): EQ2 + level + assign escono dal canale CDJ · 4× stesso PCB · metà L; R identica</text>
  <rect x="1332" y="34" width="188" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1426" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">nuovo modulo (dec. 91a)</text>
  <rect x="40" y="170" width="195" height="96" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="137.5" y="198.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">SEND TAP L/R</text>
  <text x="137.5" y="214.55" font-size="10.5" fill="#ddd" text-anchor="middle">dal canale CDJ, blocco [E]</text>
  <text x="137.5" y="230.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ, pre-filter, pre-fader</text>
  <text x="137.5" y="246.55" font-size="10.5" fill="#ddd" text-anchor="middle">backplane slot 3 del canale</text>
  <rect x="280" y="178" width="150" height="80" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="355" y="206.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER IN</text>
  <text x="355" y="222.55" font-size="10.5" fill="#444" text-anchor="middle">OPA1612 unity</text>
  <text x="355" y="238.55" font-size="10.5" fill="#444" text-anchor="middle">isola il driver di canale</text>
  <rect x="475" y="160" width="235" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="592.5" y="190.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">EQ2 — celle serie</text>
  <text x="592.5" y="206.55" font-size="10.5" fill="#444" text-anchor="middle">LOW shelf ~120 Hz</text>
  <text x="592.5" y="222.55" font-size="10.5" fill="#444" text-anchor="middle">HIGH sottrattiva ~4,5 kHz (q. 68)</text>
  <text x="592.5" y="238.55" font-size="10.5" fill="#444" text-anchor="middle">−∞ → 0 → +6, law dedicate</text>
  <text x="592.5" y="254.55" font-size="10.5" fill="#444" text-anchor="middle">pot doppi 10k custom taper</text>
  <rect x="755" y="178" width="175" height="80" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="842.5" y="206.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">LEVEL</text>
  <text x="842.5" y="222.55" font-size="10.5" fill="#444" text-anchor="middle">pot doppio 10k log</text>
  <text x="842.5" y="238.55" font-size="10.5" fill="#444" text-anchor="middle">−∞ … 0 dB (mai gain positivo)</text>
  <rect x="975" y="160" width="215" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1082.5" y="190.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">ASSIGN × 4 (S1-S4)</text>
  <text x="1082.5" y="206.55" font-size="10.5" fill="#444" text-anchor="middle">π SPDT classe ADG1434</text>
  <text x="1082.5" y="222.55" font-size="10.5" fill="#444" text-anchor="middle">serie + shunt a GND da off</text>
  <text x="1082.5" y="238.55" font-size="10.5" fill="#444" text-anchor="middle">multipli e simultanei</text>
  <text x="1082.5" y="254.55" font-size="10.5" fill="#444" text-anchor="middle">BBM + ramp 1 ms (dec. 80)</text>
  <rect x="1235" y="160" width="285" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1377.5" y="198.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER DI INIEZIONE × 8</text>
  <text x="1377.5" y="214.55" font-size="10.5" fill="#444" text-anchor="middle">OPA1654 quad × 2 (unity)</text>
  <text x="1377.5" y="230.55" font-size="10.5" fill="#444" text-anchor="middle">+ R 10k di iniezione per linea</text>
  <text x="1377.5" y="246.55" font-size="10.5" fill="#444" text-anchor="middle">OUT S1-S4 L/R = 8 linee</text>
  <path d="M 235 218 L 278 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 430 218 L 473 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 710 218 L 753 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 930 218 L 973 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1190 218 L 1233 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="1235" y="340" width="285" height="70" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1377.5" y="363.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">→ BUS FX 1-4 (backplane)</text>
  <text x="1377.5" y="379.55" font-size="10.5" fill="#ddd" text-anchor="middle">summing virtual-earth del modulo FX</text>
  <text x="1377.5" y="395.55" font-size="10.5" fill="#ddd" text-anchor="middle">net multidrop, come il DJ bus</text>
  <path d="M 1377.5 276 L 1377.5 338" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="640" y="350" width="260" height="92" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="770" y="376.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">BOTTONI ASSIGN S1-S4</text>
  <text x="770" y="392.2" font-size="10.5" fill="#444" text-anchor="middle">sul pannello del CANALE (gesto invariato)</text>
  <text x="770" y="408.2" font-size="10.5" fill="#444" text-anchor="middle">linee logiche +5 V via harness frontale</text>
  <text x="770" y="424.2" font-size="10.5" fill="#444" text-anchor="middle">l'audio non passa mai dai contatti</text>
  <rect x="985" y="356" width="195" height="80" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1082.5" y="384.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">RAMP</text>
  <text x="1082.5" y="400.2" font-size="10.5" fill="#444" text-anchor="middle">R 10k + C 100 nF sul pin IN</text>
  <text x="1082.5" y="416.2" font-size="10.5" fill="#444" text-anchor="middle">τ ≈ 0,5-1 ms: click −9 dB</text>
  <path d="M 900 396 L 983 396" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 1082.5 356 L 1082.5 278" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="1235" y="460" width="285" height="70" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1377.5" y="483.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">GLOBAL_MUTE (linea c9)</text>
  <text x="1377.5" y="499.2" font-size="10.5" fill="#444" text-anchor="middle">dal mute controller [L] del master</text>
  <text x="1377.5" y="515.2" font-size="10.5" fill="#444" text-anchor="middle">muta i buffer d'iniezione (dec. 94b)</text>
  <path d="M 1235 495 L 1212 495 L 1212 258 L 1233 258" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="40" y="340" width="550" height="190" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="390.05" font-size="13" font-weight="700" fill="#141414">PERCHÉ UN MICRO-MODULO</text>
  <text x="58" y="406.55" font-size="11" fill="#444">Il canale CDJ resta più semplice: gli resta solo il SEND TAP.</text>
  <text x="58" y="423.05" font-size="11" fill="#444">Comportamenti LOCKED invariati (SPECIFICA §2): punto di presa,</text>
  <text x="58" y="439.55" font-size="11" fill="#444">bande e law dell'EQ2, level senza gain, assign multipli.</text>
  <text x="58" y="456.05" font-size="11" fill="#444">Rumore del send chain: −98,5 dBu A-wtd per canale.</text>
  <text x="58" y="472.55" font-size="11" fill="#444">Con un assign ON il floor di sistema sale a ~−73 dBu A-wtd</text>
  <text x="58" y="489.05" font-size="11" fill="#444">(−66,6 con 4 send a level max): deroga d'uso, decisione 95.</text>
  <path d="M 40 590 L 90 590" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="594" font-size="11.5" fill="#333">audio</text>
  <path d="M 169 590 L 219 590" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="227" y="594" font-size="11.5" fill="#333">controllo: logiche +5 V / mute</text>
  <text x="40" y="678" font-size="10.5" fill="#999">Fonte: docs/fase1/fx-send-module.md v0.1-WIP (§2-§6) + sistema-backplane.md (classe FX-SEND) + sim/fx/RISULTATI-send-chain-71A.md + decisioni 91/94b/95 · 2026-10-12</text>
</svg>
