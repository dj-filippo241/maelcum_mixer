<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
  </defs>
  <rect width="1560" height="800" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MODULO CUE / CUFFIE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design S5 v0.2 (ampli cuffia ridisegnato 2026-10-12) · standard: classe cuffie Pioneer DJM, serve per mixare (dec. 96) · metà L; R identica</text>
  <rect x="1370" y="34" width="150" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1445" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">nuovo modulo (S5)</text>
  <rect x="40" y="130" width="200" height="84" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="160.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CUE 1-4 L/R</text>
  <text x="140" y="176.55" font-size="10.5" fill="#ddd" text-anchor="middle">dai canali DJ, slot 1-4</text>
  <text x="140" y="192.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ, pre-filter, pre-fader</text>
  <rect x="40" y="290" width="200" height="84" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="320.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MON IN L/R</text>
  <text x="140" y="336.55" font-size="10.5" fill="#ddd" text-anchor="middle">dal master, buffer [N], slot 5</text>
  <text x="140" y="352.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-summing, pre-master-level</text>
  <rect x="290" y="130" width="215" height="84" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="397.5" y="160.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[A] CUE SUMMING</text>
  <text x="397.5" y="176.55" font-size="10.5" fill="#444" text-anchor="middle">massa virtuale, Rf 10k, guadagno −1</text>
  <text x="397.5" y="192.55" font-size="10.5" fill="#444" text-anchor="middle">più cue attivi = sommati</text>
  <rect x="290" y="290" width="215" height="84" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="397.5" y="320.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[B] MON BUFFER</text>
  <text x="397.5" y="336.55" font-size="10.5" fill="#444" text-anchor="middle">follower diretto, guadagno +1</text>
  <text x="397.5" y="352.55" font-size="10.5" fill="#444" text-anchor="middle">niente R serie (rumore)</text>
  <rect x="560" y="200" width="200" height="104" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="660" y="232.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">[C] BLEND CUE ↔ MASTER</text>
  <text x="660" y="248.2" font-size="10.5" fill="#444" text-anchor="middle">pot doppio 10k lineare</text>
  <text x="660" y="264.2" font-size="10.5" fill="#444" text-anchor="middle">CCW = cue · CW = master</text>
  <text x="660" y="280.2" font-size="10.5" fill="#444" text-anchor="middle">centro = 50/50 (−6 / −6 dB)</text>
  <rect x="810" y="212" width="160" height="80" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="890" y="240.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[D] LEVEL</text>
  <text x="890" y="256.55" font-size="10.5" fill="#444" text-anchor="middle">pot doppio 10k log</text>
  <text x="890" y="272.55" font-size="10.5" fill="#444" text-anchor="middle">CCW = silenzio vero</text>
  <rect x="1020" y="150" width="250" height="204" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="1145" y="192.55" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">[E] AMPLI CUFFIA v0.2</text>
  <text x="1145" y="208.55" font-size="10.5" fill="#444" text-anchor="middle">OP1612 gain +1, Rf 470 Ω + Cf 330 pF</text>
  <text x="1145" y="224.55" font-size="10.5" fill="#444" text-anchor="middle">Rdrv 1 kΩ verso la rete di bias</text>
  <text x="1145" y="240.55" font-size="10.5" fill="#444" text-anchor="middle">Vbe-multiplier + trimmer: idle 20 mA</text>
  <text x="1145" y="256.55" font-size="10.5" fill="#444" text-anchor="middle">finali MJE340/350, Re 6,8 Ω</text>
  <text x="1145" y="272.55" font-size="10.5" fill="#444" text-anchor="middle">limitatori: 126-142 mA (corto 168)</text>
  <text x="1145" y="288.55" font-size="10.5" fill="#444" text-anchor="middle">THD 1 Vrms: 0,005 % su 16 Ω</text>
  <text x="1145" y="304.55" font-size="10.5" fill="#444" text-anchor="middle">max su 32 Ω: 2,85 Vrms = 254 mW</text>
  <text x="1145" y="320.55" font-size="10.5" fill="#444" text-anchor="middle">rail ±18 V locali (non sul LN)</text>
  <rect x="1320" y="190" width="200" height="124" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1420" y="224.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">[F] USCITE</text>
  <text x="1420" y="240.55" font-size="10.5" fill="#ddd" text-anchor="middle">Rserie 10 Ω × 4 (fuori anello)</text>
  <text x="1420" y="256.55" font-size="10.5" fill="#ddd" text-anchor="middle">relay DPDT × 2</text>
  <text x="1420" y="272.55" font-size="10.5" fill="#ddd" text-anchor="middle">a riposo = cuffia muta</text>
  <text x="1420" y="288.55" font-size="10.5" fill="#ddd" text-anchor="middle">→ 2 JACK stereo in parallelo</text>
  <path d="M 240 172 L 288 172" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 240 332 L 288 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 505 172 L 530 172 L 530 232 L 558 232" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 505 332 L 530 332 L 530 272 L 558 272" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 760 252 L 808 252" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 970 252 L 1018 252" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1270 252 L 1318 252" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1145" y="372" font-size="10.5" fill="#777" text-anchor="middle">stesso mix su entrambe le uscite</text>
  <rect x="1320" y="400" width="200" height="110" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1420" y="435.95" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">[G] CONTROLLO LOCALE</text>
  <text x="1420" y="451.45" font-size="10" fill="#444" text-anchor="middle">supervisore rail + timer 1,5-2 s</text>
  <text x="1420" y="466.95" font-size="10" fill="#444" text-anchor="middle">power-off: relay aperti &lt; 10 ms</text>
  <text x="1420" y="482.45" font-size="10" fill="#444" text-anchor="middle">analogico, niente MCU</text>
  <path d="M 1420 400 L 1420 316" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="40" y="430" width="620" height="130" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="467.55" font-size="13" font-weight="700" fill="#141414">POLARITÀ E FASE DEL BLEND</text>
  <text x="58" y="483.55" font-size="10.5" fill="#444">Cue summer −1 e MON +1 (il summing master inverte a monte): al centro i due lati SOMMANO.</text>
  <text x="58" y="499.55" font-size="10.5" fill="#444">Fase: il percorso master attraversa la banca 5-way (ritardi fino a ~2,5 ms a 90 Hz), il cue no.</text>
  <text x="58" y="515.55" font-size="10.5" fill="#444">Cue di un canale già in programma, al centro del blend = comb filtering udibile.</text>
  <text x="58" y="531.55" font-size="10.5" fill="#444">Comportamento normale dei crossfade cue/master (DJM, Xone): accettato, non compensato.</text>
  <rect x="700" y="430" width="580" height="130" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="718" y="467.55" font-size="13" font-weight="700" fill="#141414">GLOBAL_MUTE: IL CUE NON LO ASCOLTA</text>
  <text x="718" y="483.55" font-size="10.5" fill="#444">Scelta di Filippo (2026-10-02): durante power-on/off e guasti rail del master</text>
  <text x="718" y="499.55" font-size="10.5" fill="#444">la cuffia resta viva: si continua a preascoltare anche se il master è muto.</text>
  <text x="718" y="515.55" font-size="10.5" fill="#444">I transienti PROPRI del modulo li toglie [G] con i relay d'uscita.</text>
  <text x="718" y="531.55" font-size="10.5" fill="#444">Blend non segue la manopola master (stile DJM-900NXS2).</text>
  <rect x="40" y="590" width="1480" height="84" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="620.55" font-size="13" font-weight="700" fill="#141414">PSU LOCALE + NUMERI</text>
  <text x="58" y="636.55" font-size="10.5" fill="#444">raw ±22 V → pre-reg ±16,5 → LT3045/94 → ±15,0 V LN per [A][B][C][D] · raw ±27 V → LM317/337 → ±18 V audio per [E] (~61 mA a riposo, ≤ ~340 mA col clamp su entrambi i canali) · +5 V dal bus per [G]</text>
  <text x="58" y="652.55" font-size="10.5" fill="#444">Rumore al jack −114,5 dBu A-wtd (target −90) · isolamento blend agli estremi −116 dB · stabilità: nessun picco ad anello chiuso, quadra pulita fino a 2 nF di cavo · nessuna capacità su OUTA prima della Rserie</text>
  <path d="M 40 716 L 90 716" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="720" font-size="11.5" fill="#333">audio</text>
  <path d="M 169 716 L 219 716" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="227" y="720" font-size="11.5" fill="#333">controllo locale</text>
  <text x="40" y="778" font-size="10.5" fill="#999">Fonte: docs/fase3/sistema-cue.md v0.2 (§2-§9) + sim/system/RISULTATI-cue.md (Test 1-8) + master-out.md ADDENDUM [N] + decisioni 90b/94b/96 · 2026-10-12</text>
</svg>
