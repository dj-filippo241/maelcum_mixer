  <text x="58" y="728.55" font-size="13" font-weight="700" fill="#141414">NUMERI SIMULATI (sim/mic/)</text>
  <text x="58" y="744.55" font-size="10.5" fill="#444">MIC: EIN −126,5 dBu su 150 Ω, uguale a ogni posizione del GAIN · passa-alto −3,1 dB a 60 Hz · −0,04 dB a 35 kHz</text>
  <text x="58" y="760.55" font-size="10.5" fill="#444">MIC: CMRR 74 dB con sorgente sbilanciata di 10 Ω · overload 300 mV rms al microfono (~138 dB SPL su SM58)</text>
  <text x="58" y="776.55" font-size="10.5" fill="#444">MIC: uscita modulo −97,3 / −90,0 / −69,3 dBu A-wtd a 30 / 38 / 59 dB · sistema entro −78 fino a ~46 dB di gain</text>
  <text x="58" y="792.55" font-size="10.5" fill="#444">MONO: banda −0,19 dB a 10 Hz, −0,08 a 35 kHz · uscita −101,3 dBu A-wtd · send chiuso: −111,2 dBu A-wtd sul bus</text>
  <rect x="830" y="690" width="740" height="132" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="848" y="728.55" font-size="13" font-weight="700" fill="#141414">DECISIONE 97 (Filippo, 2026-10-13) E DOMANDE APERTE</text>
  <text x="848" y="744.55" font-size="10.5" fill="#444">Due moduli separati. Su ciascuno solo: GAIN, EQ 2 bande, 4 pot send, 1 LED di metering (rosso = clip).</text>
  <text x="848" y="760.55" font-size="10.5" fill="#444">Massimo 4 moduli MIC/MONO nel sistema: i bus FX arrivano a 12 contributori (caso già verificato).</text>
  <text x="848" y="776.55" font-size="10.5" fill="#8A4A9E">Aperto: soglie del LED tricolore (verde −6 / giallo +11 / rosso +17 dBu, sistema-metering §1)</text>
  <text x="848" y="792.55" font-size="10.5" fill="#8A4A9E">Aperto: «massimo 4» letto come 4 in totale tra MIC e MONO</text>
