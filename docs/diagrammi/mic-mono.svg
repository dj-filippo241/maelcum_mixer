  <text x="58" y="743.55" font-size="13" font-weight="700" fill="#141414">NUMERI SIMULATI (sim/mic/)</text>
  <text x="58" y="759.55" font-size="10.5" fill="#444">MIC: EIN −126,5 dBu su 150 Ω, uguale a ogni posizione del GAIN · passa-alto −3,1 dB a 60 Hz</text>
  <text x="58" y="775.55" font-size="10.5" fill="#444">MIC: CMRR 74 dB con sorgente sbilanciata di 10 Ω · overload 300 mV rms al microfono</text>
  <text x="58" y="791.55" font-size="10.5" fill="#444">MIC: uscita modulo −97,3 / −90,0 / −69,3 dBu A-wtd a 30 / 38 / 59 dB di gain</text>
  <text x="58" y="807.55" font-size="10.5" fill="#444">MIC limiter (variante 2): un grido a +20 dBu esce a +12,8 dBu, attacco ~2 ms</text>
  <text x="58" y="823.55" font-size="10.5" fill="#444">MONO: banda −0,19 dB a 10 Hz, −0,08 a 35 kHz · uscita −101,3 dBu A-wtd</text>
  <text x="58" y="839.55" font-size="10.5" fill="#444">Mandate: pot chiuso −111,2 dBu A-wtd sul bus · mute globale −53 dB col pot aperto</text>
  <rect x="870" y="712" width="830" height="150" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="888" y="743.55" font-size="13" font-weight="700" fill="#141414">DECISIONI 97, 111, 145, 167 E APERTI</text>
  <text x="888" y="759.55" font-size="10.5" fill="#444">Due moduli separati: GAIN, EQ 2 bande, 4 pot send, 1 LED; sul MIC anche il tasto MUTE.</text>
  <text x="888" y="775.55" font-size="10.5" fill="#444">Massimo 4 moduli MIC/MONO: i bus FX arrivano a 12 contributori (caso già verificato).</text>
  <text x="888" y="791.55" font-size="10.5" fill="#444">MUTE a ritenuta (dec. 167) · limiter fisso nel VCA del MUTE, solo sul MIC (dec. 145) [PROVV].</text>
  <text x="888" y="807.55" font-size="10.5" fill="#444">Schema: SCHEMA PASSA per MIC e MONO; PCB del MIC PASSA, al limite (pcb/mic/NOTE.md).</text>
  <text x="888" y="823.55" font-size="10.5" fill="#8A4A9E">Aperto: soglie del LED (−6 / +11 / +17 dBu, sistema-metering §1)</text>
  <text x="888" y="839.55" font-size="10.5" fill="#8A4A9E">Aperto: HIGH dell'EQ2 ~5 kHz (§5.1) o ~4,5 kHz come il FX-SEND</text>
