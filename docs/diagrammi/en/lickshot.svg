  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">LICKSHOT IN A 1U RACK (outside the mixer)</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — dec. 179-189: one voice, an LFO bending an oscillator, two-BBD echo inside the box · enters the mixer through a MONO module</text>
