  <text x="145" y="246.55" font-size="10.5" fill="#444" text-anchor="middle">Schmitt + 1 µF integrator</text>
  <text x="145" y="262.55" font-size="10.5" fill="#444" text-anchor="middle">sawtooth, 2-48 shots/s</text>
  <text x="145" y="278.55" font-size="10.5" fill="#444" text-anchor="middle">slow fall: the pitch drops</text>
  <rect x="300" y="200" width="200" height="100" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="400" y="230.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">VCO CD4046</text>
  <text x="400" y="246.55" font-size="10.5" fill="#444" text-anchor="middle">square wave</text>
  <text x="400" y="262.55" font-size="10.5" fill="#444" text-anchor="middle">f0 ≈ 0.7 / (R1·C1)</text>
  <text x="400" y="278.55" font-size="10.5" fill="#444" text-anchor="middle">~2-octave shot</text>
