<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 920" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="920" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">FX-RET MODULE ×4 — BUS + RETURN + REROUTE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.3-WIP: 4 identical modules, one per bus (dec. 130) · feedback matrix of 16 VCA pairs incl. self (dec. 91) · below: the module of BUS n</text>
  <rect x="1359" y="34" width="161" height="24" rx="12" fill="#D97706"/>
  <text x="1439.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">v0.3-WIP (dec. 130)</text>
  <rect x="40" y="140" width="200" height="106" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="140" y="165.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">NET Sn (backplane)</text>
  <text x="140" y="181.2" font-size="10.5" fill="#444" text-anchor="middle">4 FX-SENDs · up to 4 MIC/MONO</text>
  <text x="140" y="197.2" font-size="10.5" fill="#444" text-anchor="middle">4 reroutes (from the 4 FX-RETs)</text>
  <text x="140" y="213.2" font-size="10.5" fill="#444" text-anchor="middle">12 contributors, multidrop:</text>
  <text x="140" y="229.2" font-size="10.5" fill="#444" text-anchor="middle">R 10k at the source end</text>
  <rect x="285" y="150" width="180" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="375" y="181.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">SUMMING BUS n</text>
  <text x="375" y="197.55" font-size="10.5" fill="#444" text-anchor="middle">virtual-earth, Cf 10 pF</text>
  <text x="375" y="213.55" font-size="10.5" fill="#444" text-anchor="middle">worst 12 × 0 dBu: +21.5 dBu</text>
  <rect x="510" y="150" width="180" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="600" y="181.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">DRIVER</text>
  <text x="600" y="197.55" font-size="10.5" fill="#444" text-anchor="middle">low-Z buffer ≤ 50 Ω (OPA1612)</text>
  <text x="600" y="213.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">fixed 0 dB pad (dec. 108)</text>
  <rect x="735" y="150" width="170" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="820" y="181.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">PROTECTION</text>
  <text x="820" y="197.55" font-size="10.5" fill="#444" text-anchor="middle">series R 100 Ω + TVS ≤ 5 pF</text>
  <text x="820" y="213.55" font-size="10.5" fill="#444" text-anchor="middle">40 kHz bandwidth checked §8.4</text>
  <rect x="950" y="150" width="150" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1025" y="181.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">JACK SEND n</text>
  <text x="1025" y="197.55" font-size="10.5" fill="#ddd" text-anchor="middle">→ pedal (L/R)</text>
  <text x="1025" y="213.55" font-size="10.5" fill="#ddd" text-anchor="middle">mono = 2 × 10k sum</text>
  <rect x="1145" y="150" width="110" height="86" rx="6" fill="#F3F2EE" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1200" y="181.55" font-size="13" font-weight="700" fill="#444" text-anchor="middle">PEDAL</text>
  <text x="1200" y="197.55" font-size="10.5" fill="#555" text-anchor="middle">external</text>
  <text x="1200" y="213.55" font-size="10.5" fill="#555" text-anchor="middle">−20…+18 dBu</text>
  <rect x="1300" y="150" width="180" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1390" y="189.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">JACK RETURN n</text>
  <text x="1390" y="205.55" font-size="10.5" fill="#ddd" text-anchor="middle">← pedal (L/R, stereo-capable)</text>
  <path d="M 240 193 L 283 193" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 465 193 L 508 193" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 690 193 L 733 193" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 905 193 L 948 193" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1100 193 L 1143 193" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1255 193 L 1298 193" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="389" y="254" font-size="10" fill="#C05A1B">7.3 V margin to the ±16.5 clamp</text>
  <rect x="1290" y="290" width="200" height="84" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1390" y="320.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">PROT + DC CONTROL</text>
  <text x="1390" y="336.55" font-size="10.5" fill="#444" text-anchor="middle">integrator DC servo VALIDATED</text>
  <text x="1390" y="352.55" font-size="10.5" fill="#444" text-anchor="middle">corner 0.05-0.5 Hz, 84 dB nulling</text>
  <rect x="1290" y="404" width="200" height="66" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1390" y="433.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER HI-Z</text>
  <text x="1390" y="449.55" font-size="10.5" fill="#444" text-anchor="middle">JFET, Zin ≥ 1 MΩ (1 MΩ bias §8.4)</text>
  <rect x="1290" y="500" width="200" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1390" y="520.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">GAIN (dec. 162)</text>
  <text x="1390" y="536.55" font-size="10.5" fill="#444" text-anchor="middle">matched dual-gang linear pot</text>
  <text x="1390" y="552.55" font-size="10.5" fill="#444" text-anchor="middle">in the feedback loop (Ra 1.24k)</text>
  <text x="1390" y="568.55" font-size="10.5" fill="#444" text-anchor="middle">−∞ → 0 → +20 dB · left half = trim</text>
  <text x="1390" y="584.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">no VCA · K4 (dec. 84)</text>
  <rect x="1290" y="626" width="200" height="70" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1390" y="649.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">RETURN EQ2</text>
  <text x="1390" y="665.55" font-size="10.5" fill="#444" text-anchor="middle">series cells v0.3 VALIDATED</text>
  <text x="1390" y="681.55" font-size="10.5" fill="#444" text-anchor="middle">LOW ~120 Hz / HIGH ~4.5 kHz</text>
  <path d="M 1390 236 L 1390 288" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1390 374 L 1390 402" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1390 470 L 1390 498" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1390 596 L 1390 624" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="1020" y="626" width="220" height="70" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1130" y="649.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">RETURN METER</text>
  <text x="1130" y="665.55" font-size="10.5" fill="#444" text-anchor="middle">10-LED bar per return (dec. 116)</text>
  <text x="1130" y="681.55" font-size="10.5" fill="#444" text-anchor="middle">release ~0.3 s (dec. 81) · clip latch</text>
  <rect x="770" y="626" width="200" height="70" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="870" y="649.55" font-size="13" font-weight="700" fill="#2F6D8E" text-anchor="middle">REROUTE NODE</text>
  <text x="870" y="665.55" font-size="10.5" fill="#444" text-anchor="middle">PRE-FADER [LOCKED]</text>
  <text x="870" y="681.55" font-size="10.5" fill="#444" text-anchor="middle">fader down → feedback keeps going</text>
  <rect x="520" y="626" width="200" height="70" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="620" y="649.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">return FADER → 2 VCAs</text>
  <text x="620" y="665.55" font-size="10.5" fill="#444" text-anchor="middle">100 mm mono fader (dec. 126)</text>
  <text x="620" y="681.55" font-size="10.5" fill="#444" text-anchor="middle">→ backplane MASTER SUM</text>
  <path d="M 1290 661 L 1242 661" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1020 661 L 972 661" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 770 661 L 722 661" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="150" y="736" width="290" height="58" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="295" y="761.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">→ BACKPLANE MASTER SUM</text>
  <text x="295" y="777.55" font-size="10.5" fill="#ddd" text-anchor="middle">one input per return: MSUM2-5 (dec. 94a)</text>
  <path d="M 520 661 L 295 661 L 295 734" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="660" y="390" width="420" height="150" rx="6" fill="#F6F1F8" stroke="#8A4A9E" stroke-width="1.5"/>
  <text x="870" y="430.8" font-size="13" font-weight="700" fill="#8A4A9E" text-anchor="middle">REROUTE × 4: 3 CROSS + SELF (dec. 91b)</text>
  <text x="870" y="446.3" font-size="10" fill="#444" text-anchor="middle">4 V2181L VCA pairs per module (8 chips); 16 pairs in the mixer</text>
  <text x="870" y="461.8" font-size="10" fill="#444" text-anchor="middle">piecewise SPEC law verified end-to-end (§8.3)</text>
  <text x="870" y="477.3" font-size="10" fill="#444" text-anchor="middle">INVERTING unity injection driver → nets S1-S4 (R 10k)</text>
  <text x="870" y="492.8" font-size="10" fill="#8A4A9E" text-anchor="middle">self-route ALLOWED: out on its own net and back in</text>
  <text x="870" y="508.3" font-size="10" fill="#444" text-anchor="middle">bounded-by-design confirmed on the self path (§8.5)</text>
  <path d="M 870 626 L 870 542" stroke="#8A4A9E" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <path d="M 870 390 L 870 300 L 375 300 L 375 238" stroke="#8A4A9E" stroke-width="2.2" fill="none" marker-end="url(#arb)"/>
  <text x="389" y="292" font-size="10.5" fill="#8A4A9E">to the SUMMING of all 4 buses, its OWN included (via backplane) · loop = GAIN + reroute (LEVEL outside): with GAIN +20 it self-oscillates at ~45 % reroute</text>
  <rect x="290" y="400" width="320" height="130" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="450" y="430.8" font-size="13" font-weight="700" fill="#2F6D8E" text-anchor="middle">REROUTE CV CHAIN</text>
  <text x="450" y="446.3" font-size="10" fill="#444" text-anchor="middle">9 mm pot with centre detent (dec. 125)</text>
  <text x="450" y="461.8" font-size="10" fill="#444" text-anchor="middle">→ CV buffer → piecewise shaper (dec. 70)</text>
  <text x="450" y="477.3" font-size="10" fill="#444" text-anchor="middle">→ 1 ms smoothing (dec. 80)</text>
  <text x="450" y="492.8" font-size="10" fill="#444" text-anchor="middle">→ CV 6.1 mV/dB to the VCAs (dec. 92)</text>
  <text x="450" y="508.3" font-size="10" fill="#444" text-anchor="middle">1 CV per L/R pair</text>
  <path d="M 610 465 L 658 465" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="520" y="730" width="970" height="110" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="538" y="761.925" font-size="10.5" fill="#444">±18 V audio (summing/driver/VCA) · ±15 V LN (CV/shaper/servo) · VCAs per module: 8 reroute + 2 fader = 10 (4 modules: 40)</text>
  <text x="538" y="777.925" font-size="10.5" fill="#444">mixer ~54 VCAs (sistema-vca-trim §4) · CoolAudio V2181L clone route, purchase after the prototype · send mute: GLOBAL_MUTE (dec. 94b)</text>
  <text x="538" y="793.925" font-size="10.5" fill="#444">noise: return −96.1 dBu A (dec. 162) · bus from −101.3 to −91.5 dBu A with the 4 reroute injections (target −88)</text>
  <text x="538" y="809.925" font-size="10.5" fill="#444">boards [PROVISIONAL, todo 249]: signal with C96 + reroute without C96, 2×16 bridge · PCB: both PASS</text>
  <path d="M 40 866 L 90 866" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="870" font-size="11.5" fill="#333">audio</text>
  <path d="M 169 866 L 219 866" stroke="#8A4A9E" stroke-width="2.2"/>
  <text x="227" y="870" font-size="11.5" fill="#333">feedback (reroute)</text>
  <path d="M 378 866 L 428 866" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="436" y="870" font-size="11.5" fill="#333">control / CV</text>
  <rect x="550" y="857" width="50" height="18" rx="4" fill="#F3F2EE" stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="608" y="870" font-size="11.5" fill="#333">outside the mixer</text>
  <text x="40" y="898" font-size="10.5" fill="#999">Source: docs/fase1/fx-module.md v0.3-WIP (§2bis dec. 130, §5 dec. 162, §7, §8.3-8.5) + sistema-vca-trim.md §4 + sistema-polarita.md + sim/fx/RISULTATI-fx-ret-bus-130.md · 2026-11-04</text>
