<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="800" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">CUE / HEADPHONE MODULE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design S5 v0.2 (headphone amp 2026-10-12, polarity REV 2026-11-03) · standard: Pioneer DJM headphone class (dec. 96) · L half; R identical</text>
  <rect x="1370" y="34" width="150" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1445" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">S5 v0.2</text>
  <rect x="40" y="130" width="200" height="84" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="160.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">CUE 1-4 L/R</text>
  <text x="140" y="176.55" font-size="10.5" fill="#ddd" text-anchor="middle">from the DJ channels, slots 1-4</text>
  <text x="140" y="192.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ, pre-filter, pre-fader</text>
  <rect x="40" y="290" width="200" height="84" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="140" y="320.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MON IN L/R</text>
  <text x="140" y="336.55" font-size="10.5" fill="#ddd" text-anchor="middle">from the master, buffer [N], slot 5</text>
  <text x="140" y="352.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-summing, pre-master-level</text>
  <rect x="290" y="130" width="215" height="84" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="397.5" y="160.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[A] CUE SUMMING</text>
  <text x="397.5" y="176.55" font-size="10.5" fill="#444" text-anchor="middle">virtual earth, Rf 10k, gain −1</text>
  <text x="397.5" y="192.55" font-size="10.5" fill="#444" text-anchor="middle">several cues active = summed</text>
  <rect x="290" y="290" width="215" height="84" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="397.5" y="320.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[B] MON BUFFER</text>
  <text x="397.5" y="336.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">inverting 20k/20k 0.1 % (todo 227)</text>
  <text x="397.5" y="352.55" font-size="10.5" fill="#444" text-anchor="middle">load for [N] ≤ 50 Ω [PROV]</text>
  <rect x="560" y="200" width="200" height="104" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="660" y="232.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">[C] BLEND CUE ↔ MASTER</text>
  <text x="660" y="248.2" font-size="10.5" fill="#444" text-anchor="middle">dual 10k linear pot</text>
  <text x="660" y="264.2" font-size="10.5" fill="#444" text-anchor="middle">CCW = cue · CW = master</text>
  <text x="660" y="280.2" font-size="10.5" fill="#444" text-anchor="middle">centre = 50/50 (−6 / −6 dB)</text>
  <rect x="810" y="212" width="160" height="80" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="890" y="240.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[D] LEVEL</text>
  <text x="890" y="256.55" font-size="10.5" fill="#444" text-anchor="middle">dual 10k log pot</text>
  <text x="890" y="272.55" font-size="10.5" fill="#444" text-anchor="middle">CCW = true silence</text>
  <rect x="1020" y="150" width="250" height="204" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="1145" y="192.55" font-size="13" font-weight="700" fill="#1F7A4D" text-anchor="middle">[E] HEADPHONE AMP v0.2</text>
  <text x="1145" y="208.55" font-size="10.5" fill="#444" text-anchor="middle">OP1612 gain +1, Rf 470 Ω + Cf 330 pF</text>
  <text x="1145" y="224.55" font-size="10.5" fill="#444" text-anchor="middle">Rdrv 1 kΩ into the bias network</text>
  <text x="1145" y="240.55" font-size="10.5" fill="#444" text-anchor="middle">Vbe multiplier + trimmer: idle 20 mA</text>
  <text x="1145" y="256.55" font-size="10.5" fill="#444" text-anchor="middle">MJE340/350 output pair, Re 6.8 Ω</text>
  <text x="1145" y="272.55" font-size="10.5" fill="#444" text-anchor="middle">current limits: 126-142 mA (short 168)</text>
  <text x="1145" y="288.55" font-size="10.5" fill="#444" text-anchor="middle">THD 1 Vrms: 0.005 % into 16 Ω</text>
  <text x="1145" y="304.55" font-size="10.5" fill="#444" text-anchor="middle">max into 32 Ω: 2.85 Vrms = 254 mW</text>
  <text x="1145" y="320.55" font-size="10.5" fill="#444" text-anchor="middle">local ±18 V rails (not on LN)</text>
  <rect x="1320" y="190" width="200" height="124" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1420" y="224.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">[F] OUTPUTS</text>
  <text x="1420" y="240.55" font-size="10.5" fill="#ddd" text-anchor="middle">series R 10 Ω × 4 (outside loop)</text>
  <text x="1420" y="256.55" font-size="10.5" fill="#ddd" text-anchor="middle">DPDT relay × 2</text>
  <text x="1420" y="272.55" font-size="10.5" fill="#ddd" text-anchor="middle">at rest = headphones muted</text>
  <text x="1420" y="288.55" font-size="10.5" fill="#ddd" text-anchor="middle">→ 2 stereo 6.3 mm jacks (128)</text>
  <path d="M 240 172 L 288 172" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 240 332 L 288 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 505 172 L 530 172 L 530 232 L 558 232" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 505 332 L 530 332 L 530 272 L 558 272" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 760 252 L 808 252" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 970 252 L 1018 252" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1270 252 L 1318 252" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="1145" y="372" font-size="10.5" fill="#777" text-anchor="middle">same mix on both outputs</text>
  <rect x="1320" y="400" width="200" height="110" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1420" y="435.95" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">[G] LOCAL CONTROL</text>
  <text x="1420" y="451.45" font-size="10" fill="#444" text-anchor="middle">rail supervisor + 1.5-2 s timer</text>
  <text x="1420" y="466.95" font-size="10" fill="#444" text-anchor="middle">power-off: relays open &lt; 10 ms</text>
  <text x="1420" y="482.45" font-size="10" fill="#444" text-anchor="middle">analogue, no MCU</text>
  <path d="M 1420 400 L 1420 316" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="40" y="430" width="620" height="130" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="467.55" font-size="13" font-weight="700" fill="#141414">BLEND POLARITY AND PHASE</text>
  <text x="58" y="483.55" font-size="10.5" fill="#8A4A9E">REV todo 227: the channel reaches [A2] already inverted by the DJ bus receiver;</text>
  <text x="58" y="499.55" font-size="10.5" fill="#8A4A9E">with MON non-inverted the blend centre cancelled: buffer [B] now inverting.</text>
  <text x="58" y="515.55" font-size="10.5" fill="#444">Phase: the master goes through the 5-way bank (delays up to ~2.5 ms), the cue doesn't.</text>
  <text x="58" y="531.55" font-size="10.5" fill="#444">Cueing a channel already in the program, blend centred = comb filtering: accepted.</text>
  <rect x="700" y="430" width="580" height="130" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="718" y="467.55" font-size="13" font-weight="700" fill="#141414">GLOBAL_MUTE: THE CUE IGNORES IT</text>
  <text x="718" y="483.55" font-size="10.5" fill="#444">Filippo's choice (2026-10-02): during power-on/off and master rail faults</text>
  <text x="718" y="499.55" font-size="10.5" fill="#444">the headphones stay live: you keep pre-listening even when the master is muted.</text>
  <text x="718" y="515.55" font-size="10.5" fill="#444">The module's OWN transients are removed by [G] with the output relays.</text>
  <text x="718" y="531.55" font-size="10.5" fill="#444">The blend doesn't follow the master knob (DJM-900NXS2 style).</text>
  <rect x="40" y="590" width="1480" height="84" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="620.55" font-size="13" font-weight="700" fill="#141414">LOCAL PSU + FIGURES</text>
  <text x="58" y="636.55" font-size="10.5" fill="#444">±19 V LN from the box → pre-reg ±16.5 → LT3045/94 → ±15.0 V LN for [A][B][C][D] · ±22.0 V audio → LM317/337 → ±18 V for [E] (~61 mA idle, ≤ ~340 mA in clamp) · +5 V from the bus for [G]</text>
  <text x="58" y="652.55" font-size="10.5" fill="#444">Noise at the jack −114.5 dBu A-wtd (target −90) · blend isolation at the ends −116 dB · stability: no closed-loop peaking, clean square wave up to 2 nF of cable</text>
  <path d="M 40 716 L 90 716" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="720" font-size="11.5" fill="#333">audio</text>
  <path d="M 169 716 L 219 716" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="227" y="720" font-size="11.5" fill="#333">local control</text>
  <rect x="347" y="708" width="46" height="16" rx="8" fill="#8A4A9E"/>
  <text x="405" y="720" font-size="11.5" fill="#333">highlighted note</text>
  <text x="40" y="778" font-size="10.5" fill="#999">Source: docs/fase3/sistema-cue.md v0.2 (§2-§9, §7 REV 2026-11-03) + sistema-polarita.md F4 + sim/system/RISULTATI-cue.md + master-out.md ADDENDUM [N] + decisions 96/128 · 2026-11-04</text>
</svg>
