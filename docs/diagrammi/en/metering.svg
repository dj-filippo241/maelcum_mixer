<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="960" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">METERING SYSTEM — ZONED LED BARS</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design S4 v0.1 · Pioneer DJM ballistics (dec. 81) · absolute thresholds (dec. 90): +24 dBu full scale on every bar</text>
  <rect x="1339" y="34" width="181" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1429.5" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">11 bars + mic/mono LED</text>
  <text x="40" y="122" font-size="13" font-weight="700" fill="#141414">PICKOFF POINTS (SPECIFICA §11, locked)</text>
  <rect x="40" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="175" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">MASTER L/R</text>
  <text x="175" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post master level,</text>
  <text x="175" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">pre HV stage</text>
  <text x="175" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">2 bars of 20 segments</text>
  <rect x="340" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="475" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">DJ × 4</text>
  <text x="475" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ, pre-fader,</text>
  <text x="475" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">no filter (dec. 161b)</text>
  <text x="475" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">4 bars of 10 segments</text>
  <rect x="640" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="775" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5-WAY</text>
  <text x="775" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post-drive, pre</text>
  <text x="775" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">master sum (g × 2)</text>
  <text x="775" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">1 bar of 10 segments</text>
  <rect x="940" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1075" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">FX RETURNS × 4</text>
  <text x="1075" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">post gain/EQ2, pre-fader</text>
  <text x="1075" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">one per return (dec. 116)</text>
  <text x="1075" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">4 bars of 10 segments</text>
  <rect x="1240" y="136" width="270" height="86" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1375" y="159.375" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">MIC / MONO</text>
  <text x="1375" y="175.375" font-size="10.5" fill="#ddd" text-anchor="middle">after the preamp,</text>
  <text x="1375" y="191.375" font-size="10.5" fill="#ddd" text-anchor="middle">before the EQ2</text>
  <text x="1375" y="207.375" font-size="10.5" fill="#ddd" text-anchor="middle">tricolour LED only</text>
  <text x="40" y="268" font-size="13" font-weight="700" fill="#141414">CHAIN PER BAR (§2) — one per bar, detector on ±15 V LN</text>
  <rect x="40" y="284" width="220" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="150" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">INPUT</text>
  <text x="150" y="328.45" font-size="10" fill="#444" text-anchor="middle">gain g + ±2 % trim</text>
  <text x="150" y="343.95" font-size="10" fill="#444" text-anchor="middle">(per-zone calibration)</text>
  <text x="150" y="359.45" font-size="10" fill="#444" text-anchor="middle">OPA1612 buffer</text>
  <rect x="300" y="284" width="220" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="410" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">SUPERDIODE</text>
  <text x="410" y="328.45" font-size="10" fill="#444" text-anchor="middle">op-amp + 1N4148</text>
  <text x="410" y="343.95" font-size="10" fill="#444" text-anchor="middle">anti-windup clamp −1.5 V</text>
  <text x="410" y="359.45" font-size="10" fill="#444" text-anchor="middle">attack 0.23 ms</text>
  <rect x="560" y="284" width="220" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="670" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">HOLD + RELEASE</text>
  <text x="670" y="328.45" font-size="10" fill="#444" text-anchor="middle">C 100 nF alone on the node</text>
  <text x="670" y="343.95" font-size="10" fill="#444" text-anchor="middle">R 2M + 3.3M trimmer</text>
  <text x="670" y="359.45" font-size="10" fill="#444" text-anchor="middle">τ 0.2…0.53 s (0.3 typical)</text>
  <rect x="820" y="284" width="200" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="920" y="312.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">BUFFER</text>
  <text x="920" y="328.45" font-size="10" fill="#444" text-anchor="middle">peak hold +24.00 dBu</text>
  <text x="920" y="343.95" font-size="10" fill="#444" text-anchor="middle">droop −2.9 dB/cycle</text>
  <text x="920" y="359.45" font-size="10" fill="#444" text-anchor="middle">at 10 Hz (dec. 81)</text>
  <rect x="1060" y="254" width="220" height="76" rx="6" fill="#F1F7F3" stroke="#1F7A4D" stroke-width="1.5"/>
  <text x="1170" y="280.7" font-size="12" font-weight="700" fill="#1F7A4D" text-anchor="middle">LM3915 (scale)</text>
  <text x="1170" y="296.2" font-size="10" fill="#444" text-anchor="middle">10 seg. × 3 dB · master:</text>
  <text x="1170" y="311.7" font-size="10" fill="#444" text-anchor="middle">2 cascaded chips = 20</text>
  <rect x="1060" y="354" width="220" height="76" rx="6" fill="#F6F1F8" stroke="#8A4A9E" stroke-width="1.5"/>
  <text x="1170" y="380.7" font-size="12" font-weight="700" fill="#8A4A9E" text-anchor="middle">PURPLE (clip latch)</text>
  <text x="1170" y="396.2" font-size="10" fill="#444" text-anchor="middle">LM339 at +23 dBu</text>
  <text x="1170" y="411.7" font-size="10" fill="#444" text-anchor="middle">one-shot 0.7 s → 479 ms</text>
  <path d="M 260 332 L 298 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 520 332 L 558 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 780 332 L 818 332" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1020 332 L 1040 332 L 1040 292 L 1058 292" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1040 332 L 1040 392 L 1058 392" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <circle cx="1040" cy="332" r="5" fill="#C05A1B"/>
  <rect x="1320" y="254" width="200" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1420" y="291.95" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">LED</text>
  <text x="1420" y="307.45" font-size="10" fill="#444" text-anchor="middle">LM3915 on the +5 V control rail</text>
  <text x="1420" y="322.95" font-size="10" fill="#444" text-anchor="middle">(LEDs isolated from the LN rail)</text>
  <text x="1420" y="338.45" font-size="10" fill="#444" text-anchor="middle">2-5 mA per segment</text>
  <text x="1420" y="353.95" font-size="10" fill="#444" text-anchor="middle">worst ~0.67 A (5 mA)</text>
  <text x="1420" y="369.45" font-size="10" fill="#444" text-anchor="middle">~0.27 A with 2 mA LEDs</text>
  <text x="1420" y="384.95" font-size="10" fill="#444" text-anchor="middle">master purple: sensing</text>
  <text x="1420" y="400.45" font-size="10" fill="#444" text-anchor="middle">of the HV stage [open]</text>
  <path d="M 1280 292 L 1318 292" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1280 392 L 1318 392" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <text x="40" y="470" font-size="13" font-weight="700" fill="#141414">SCALE AND COLOURS (§3) — dec. 90 thresholds met, yellow/amber split at +12 [PROV]</text>
  <rect x="40" y="490" width="236" height="40" rx="6" fill="#3B6FB6"/>
  <text x="158" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">BLUE</text>
  <text x="158" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">&lt; −6 dBu</text>
  <text x="158" y="568" font-size="10.5" fill="#666" text-anchor="middle">master only (9 seg.)</text>
  <rect x="288" y="490" width="236" height="40" rx="6" fill="#2E9E4F"/>
  <text x="406" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">GREEN</text>
  <text x="406" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">−6 … +6</text>
  <text x="406" y="568" font-size="10.5" fill="#666" text-anchor="middle">program around 0</text>
  <rect x="536" y="490" width="236" height="40" rx="6" fill="#E3C21B"/>
  <text x="654" y="515" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">YELLOW</text>
  <text x="654" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">+6 … +12</text>
  <text x="654" y="568" font-size="10.5" fill="#666" text-anchor="middle">loud</text>
  <rect x="784" y="490" width="236" height="40" rx="6" fill="#E88A1A"/>
  <text x="902" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">AMBER</text>
  <text x="902" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">+12 … +18</text>
  <text x="902" y="568" font-size="10.5" fill="#666" text-anchor="middle">very loud</text>
  <rect x="1032" y="490" width="236" height="40" rx="6" fill="#D2322D"/>
  <text x="1150" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">RED</text>
  <text x="1150" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">+18 … +24</text>
  <text x="1150" y="568" font-size="10.5" fill="#666" text-anchor="middle">extreme</text>
  <rect x="1280" y="490" width="236" height="40" rx="6" fill="#8A4A9E"/>
  <text x="1398" y="515" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PURPLE</text>
  <text x="1398" y="550" font-size="11.5" font-weight="600" fill="#141414" text-anchor="middle">≥ +23 latch</text>
  <text x="1398" y="568" font-size="10.5" fill="#666" text-anchor="middle">clip, dedicated LED</text>
  <text x="40" y="598" font-size="11" fill="#444">10-segment zones: +24 … −3 dBu (below −3 the bar is dark). 20-segment master: +24 … −33 dBu.</text>
  <rect x="40" y="630" width="720" height="110" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="58" y="657.2" font-size="12" font-weight="700" fill="#2F6D8E">SHARED REFERENCE TREE (§5)</text>
  <text x="58" y="673.2" font-size="10.5" fill="#444">+15 V LN → 10k/5k 0.1 % divider → follower → vrefA 5.000 V = +24 dBu full scale (all bars)</text>
  <text x="58" y="689.2" font-size="10.5" fill="#444">→ 10k/4.625k 0.1 % divider → follower → vrefB 1.581 V (second chip of the master cascades)</text>
  <text x="58" y="705.2" font-size="10.5" fill="#8A4A9E">followers mandatory: the bare loaded divider sagged to 4.07 V (sim finding)</text>
  <text x="58" y="721.2" font-size="10.5" fill="#444">identical calibration by construction: error ≤ ±0.012 dB</text>
  <rect x="800" y="630" width="720" height="110" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="818" y="665.2" font-size="12" font-weight="700" fill="#141414">MIC / MONO: ONE TRICOLOUR LED (dec. 97)</text>
  <text x="818" y="681.2" font-size="10.5" fill="#444">green = signal ok (≥ −6 dBu) · yellow = near clip (≥ +11) · red = clip (≥ +17, latch)</text>
  <text x="818" y="697.2" font-size="10.5" fill="#444">red at +17, not +23: the mic front end on ±15 V clips earlier, and the EQ2 adds up to +6</text>
  <text x="818" y="713.2" font-size="10.5" fill="#444">thresholds [PROVISIONAL] · LM339 comparators shared with the zone purple</text>
  <rect x="40" y="770" width="1480" height="92" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="796.2" font-size="12" font-weight="700" fill="#141414">BOM AND OPEN ITEMS</text>
  <text x="58" y="812.2" font-size="10.5" fill="#444">Rough BOM: 13 LM3915 · ~12 OPA1612 · 3 LM339 · ~133 LEDs + 11 purple · ~50-80 € [very PROVISIONAL]. LM3915 alternative: LM339 ladder (10× the chips).</text>
  <text x="58" y="828.2" font-size="10.5" fill="#444">No meters on booth, rec, headphones and sends (SPECIFICA §11). Open (item 40 / q54): bar placement, 10 or 20 segments per zone,</text>
  <text x="58" y="844.2" font-size="10.5" fill="#444">brightness 2 or 5 mA (2 mA recommended), master purple with one or two criteria, calibration procedure with tones at known levels.</text>
  <path d="M 40 892 L 90 892" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="896" font-size="11.5" fill="#333">signal</text>
  <path d="M 175 892 L 225 892" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="233" y="896" font-size="11.5" fill="#333">references / logic</text>
  <text x="40" y="938" font-size="10.5" fill="#999">Source: docs/fase3/sistema-metering.md v0.1 (§1-§9, REV dec. 116) + sim/system/meter-*.cir + sim/meter/RISULTATI-peak-det.md + decisions 81/90/97/116/161 · 2026-11-04</text>
</svg>
