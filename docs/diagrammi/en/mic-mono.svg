  <text x="58" y="743.55" font-size="13" font-weight="700" fill="#141414">SIMULATED FIGURES (sim/mic/)</text>
  <text x="58" y="759.55" font-size="10.5" fill="#444">MIC: EIN −126.5 dBu at 150 Ω, same at every GAIN setting · high-pass −3.1 dB at 60 Hz</text>
  <text x="58" y="775.55" font-size="10.5" fill="#444">MIC: CMRR 74 dB with a 10 Ω source imbalance · overload 300 mV rms at the mic</text>
  <text x="58" y="791.55" font-size="10.5" fill="#444">MIC: module output −97.3 / −90.0 / −69.3 dBu A-wtd at 30 / 38 / 59 dB gain</text>
  <text x="58" y="807.55" font-size="10.5" fill="#444">MIC limiter (variant 2): a +20 dBu shout comes out at +12.8 dBu, attack ~2 ms</text>
  <text x="58" y="823.55" font-size="10.5" fill="#444">MONO: bandwidth −0.19 dB at 10 Hz, −0.08 at 35 kHz · output −101.3 dBu A-wtd</text>
  <text x="58" y="839.55" font-size="10.5" fill="#444">Sends: pot closed −111.2 dBu A-wtd on the bus · global mute −53 dB with pot open</text>
  <rect x="870" y="712" width="830" height="150" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="888" y="743.55" font-size="13" font-weight="700" fill="#141414">DECISIONS 97, 111, 145, 167 AND OPEN ITEMS</text>
  <text x="888" y="759.55" font-size="10.5" fill="#444">Two separate modules: GAIN, 2-band EQ, 4 send pots, 1 LED; on the MIC also the MUTE button.</text>
  <text x="888" y="775.55" font-size="10.5" fill="#444">At most 4 MIC/MONO modules: the FX buses reach 12 contributors (case already verified).</text>
  <text x="888" y="791.55" font-size="10.5" fill="#444">Latching MUTE (dec. 167) · fixed limiter in the MUTE VCA, MIC only (dec. 145) [PROV].</text>
  <text x="888" y="807.55" font-size="10.5" fill="#444">Schematic: SCHEMATIC PASSES for MIC and MONO; MIC PCB PASSES, marginally (pcb/mic/NOTE.md).</text>
  <text x="888" y="823.55" font-size="10.5" fill="#8A4A9E">Open: LED thresholds (−6 / +11 / +17 dBu, sistema-metering §1)</text>
  <text x="888" y="839.55" font-size="10.5" fill="#8A4A9E">Open: EQ2 HIGH at ~5 kHz (§5.1) or ~4.5 kHz like the FX-SEND</text>
