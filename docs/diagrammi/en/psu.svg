  <text x="1095" y="621" font-size="10" fill="#444" text-anchor="middle">PSU-IN: TVS · T2 A · 1 mF on +5</text>
  <text x="1095" y="636.5" font-size="10" fill="#444" text-anchor="middle">V_FAN: T500 mA → fan driver</text>
  <rect x="1255" y="590" width="270" height="76" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1390" y="613.25" font-size="10" fill="#444" text-anchor="middle">meter LEDs · logic · relays</text>
  <text x="1390" y="628.75" font-size="10" fill="#444" text-anchor="middle">supervisor · 2 fans</text>
  <text x="1390" y="644.25" font-size="10" fill="#8A4A9E" text-anchor="middle">+5 worst ~1.15 A · fans 0.3 A</text>
