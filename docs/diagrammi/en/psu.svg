  <rect x="40" y="290" width="390" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="334.2" font-size="12" font-weight="700" fill="#141414">PROTECTION (§2.7, §4.3)</text>
  <text x="58" y="350.2" font-size="10.5" fill="#444">mains: double-pole switch · T3.15 A · NTC + relay</text>
  <text x="58" y="366.2" font-size="10.5" fill="#444">secondaries: slow-blow fuses before the bridges</text>
  <text x="58" y="382.2" font-size="10.5" fill="#444">   (T8 A · T2 A · T630 mA · T3.15 A) · thermal</text>
  <text x="58" y="398.2" font-size="10.5" fill="#444">outputs: LDO current limit (short in the cable)</text>
  <text x="58" y="414.2" font-size="10.5" fill="#444">in the mixer: TVS + group fuse per rail (PSU-IN)</text>
  <text x="58" y="430.2" font-size="10.5" fill="#444">   + PTC per slot and rail on the backplane [PROV]</text>
  <rect x="40" y="490" width="390" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="534.2" font-size="12" font-weight="700" fill="#141414">EARTH AND 0 V (§3, §4.2)</text>
  <text x="58" y="550.2" font-size="10.5" fill="#444">mains earth → box chassis</text>
  <text x="58" y="566.2" font-size="10.5" fill="#444">→ dedicated PE conductor (first make) + shield</text>
  <text x="58" y="582.2" font-size="10.5" fill="#444">→ mixer chassis</text>
  <text x="58" y="598.2" font-size="10.5" fill="#444">in the box the 0 V lines don't touch earth: each 0 V</text>
  <text x="58" y="614.2" font-size="10.5" fill="#444">runs separately to the star point in the PSU-IN</text>
  <text x="58" y="630.2" font-size="10.5" fill="#444">(single chassis ↔ AGND bond, sistema-grounding §2)</text>
  <rect x="40" y="700" width="850" height="80" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="465" y="728.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">AC_OK DETECTOR (§2.5, §2.6)</text>
  <text x="465" y="744.2" font-size="10.5" fill="#444" text-anchor="middle">full-wave from W1 · τ 42.7 ms · threshold at 75 % of peak · open collector, high = mains present</text>
  <text x="465" y="760.2" font-size="10.5" fill="#444" text-anchor="middle">mute in ≤ 12.7 ms; with 22 mF bulk the local regulators drop out at ≥ 25.1 ms (mains −10 %): margin ≥ 12.4 ms</text>
  <rect x="965" y="690" width="270" height="176" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="983" y="727.95" font-size="12" font-weight="700" fill="#2F6D8E">SUPERVISOR AND MUTE (§4.4)</text>
  <text x="983" y="743.45" font-size="10" fill="#444">runs on the box +5, senses the regulated rails</text>
  <text x="983" y="758.95" font-size="10" fill="#444">±22 &lt; 21.2 / &gt; 23.5 V · ±19 &lt; 18.3 / &gt; 20.5</text>
  <text x="983" y="774.45" font-size="10" fill="#444">[M] &lt; 22.0 V (5 ms) · +5 &lt; 4.6 / &gt; 5.5 V</text>
  <text x="983" y="789.95" font-size="10" fill="#444">AC_OK low → immediate mute (1 ms filter)</text>
  <text x="983" y="805.45" font-size="10" fill="#444">re-arm 1.5-2 s after recovery</text>
  <text x="983" y="820.95" font-size="10" fill="#444">cable unplugged = relays released, no pop</text>
  <text x="983" y="836.45" font-size="10" fill="#444">→ GLOBAL_MUTE (c9) + master relays</text>
  <path d="M 890 740 L 963 740" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="1255" y="690" width="270" height="176" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="1273" y="735.7" font-size="12" font-weight="700" fill="#141414">FANS AND HEAT (§4.5, §5)</text>
  <text x="1273" y="751.2" font-size="10" fill="#444">2 fans: NTC on the ±18 regulator bar</text>
  <text x="1273" y="766.7" font-size="10" fill="#444">linear driver from V_FAN, no PWM</text>
  <text x="1273" y="782.2" font-size="10" fill="#444">off &lt; 35 °C · ~6 V at 35 °C · max at 50 °C</text>
  <text x="1273" y="797.7" font-size="10" fill="#444">fan stalled &gt; 45 °C → fault LED, no mute</text>
  <text x="1273" y="813.2" font-size="10" fill="#444">heat in the mixer ~118 W · ~132 W with options</text>
  <text x="1273" y="828.7" font-size="10" fill="#444">internal air ~+4 K above ambient</text>
