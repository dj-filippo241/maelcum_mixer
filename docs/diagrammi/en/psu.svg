  <text x="1245" y="187.2" font-size="10.5" fill="#444" text-anchor="middle">±22 audio 2+2 · ±19 LN 1+1 · ±27 [M] 1+1 · +5 2 · V_FAN 1+1 · AC_OK 1 · PE 1</text>
  <text x="1245" y="203.2" font-size="10.5" fill="#444" text-anchor="middle">each 0 V on its own conductors up to the star · drops ≤ 60 mV</text>
