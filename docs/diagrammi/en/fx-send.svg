<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A4A9E"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1560" height="720" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">FX-SEND MICRO-MODULE (×4, one per channel)</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.1-WIP + PCB v0.2 (dec. 91a, 133-136): EQ2 + level + assign moved out of the CDJ channel · 4× same PCB · L half; R identical</text>
  <rect x="1370" y="34" width="150" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1445" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">PCB v0.2 PASSES</text>
  <rect x="40" y="170" width="195" height="96" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="137.5" y="198.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">SEND TAP L/R</text>
  <text x="137.5" y="214.55" font-size="10.5" fill="#ddd" text-anchor="middle">from the CDJ channel, block [E]</text>
  <text x="137.5" y="230.55" font-size="10.5" fill="#ddd" text-anchor="middle">post-EQ, pre-filter, pre-fader</text>
  <text x="137.5" y="246.55" font-size="10.5" fill="#ddd" text-anchor="middle">channel backplane slot 3</text>
  <rect x="275" y="178" width="150" height="80" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="350" y="206.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">BUFFER IN</text>
  <text x="350" y="222.55" font-size="10.5" fill="#444" text-anchor="middle">OPA1612 unity</text>
  <text x="350" y="238.55" font-size="10.5" fill="#444" text-anchor="middle">isolates channel driver</text>
  <rect x="465" y="160" width="240" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="585" y="191.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">EQ2 — series cells</text>
  <text x="585" y="207.05" font-size="10" fill="#444" text-anchor="middle">LOW shelf ~120 Hz (Baxandall,</text>
  <text x="585" y="222.55" font-size="10" fill="#444" text-anchor="middle">one dual 10k pot per cell)</text>
  <text x="585" y="238.05" font-size="10" fill="#444" text-anchor="middle">subtractive HIGH ~4.5 kHz (q. 68)</text>
  <text x="585" y="253.55" font-size="10" fill="#444" text-anchor="middle">−∞ → 0 → +6 · linear pot + R (129 A3)</text>
  <rect x="745" y="170" width="185" height="96" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="837.5" y="198.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">LEVEL</text>
  <text x="837.5" y="214.55" font-size="10.5" fill="#444" text-anchor="middle">dual 10k log (A) pot</text>
  <text x="837.5" y="230.55" font-size="10.5" fill="#444" text-anchor="middle">−20 dB at mid, never gain &gt; 0</text>
  <text x="837.5" y="246.55" font-size="10.5" fill="#8A4A9E" text-anchor="middle">sole level to the pedal (108)</text>
  <rect x="970" y="160" width="230" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1085" y="191.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">INJECTION BUFFERS</text>
  <text x="1085" y="207.05" font-size="10" fill="#444" text-anchor="middle">OPA1654 quad × 2 (unity)</text>
  <text x="1085" y="222.55" font-size="10" fill="#444" text-anchor="middle">8 sections: S1-S4 × L/R</text>
  <text x="1085" y="238.05" font-size="10" fill="#444" text-anchor="middle">+ 10k injection R per line</text>
  <text x="1085" y="253.55" font-size="10" fill="#8A4A9E" text-anchor="middle">[PROV] 1 buffer per side: same noise</text>
  <rect x="1240" y="160" width="280" height="116" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1380" y="191.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">ASSIGN × 4 (S1-S4)</text>
  <text x="1380" y="207.05" font-size="10" fill="#444" text-anchor="middle">π SPDT ADG1434 AFTER the 10k R:</text>
  <text x="1380" y="222.55" font-size="10" fill="#444" text-anchor="middle">on the bus virtual-earth node</text>
  <text x="1380" y="238.05" font-size="10" fill="#444" text-anchor="middle">(sees ~8 mV: no clipping at +22 dBu)</text>
  <text x="1380" y="253.55" font-size="10" fill="#444" text-anchor="middle">multiple and simultaneous [LOCKED]</text>
  <path d="M 235 218 L 273 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 425 218 L 463 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 705 218 L 743 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 930 218 L 968 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <path d="M 1200 218 L 1238 218" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="1240" y="340" width="280" height="70" rx="6" fill="#141414" stroke="#141414" stroke-width="1.5"/>
  <text x="1380" y="363.55" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">→ FX BUSES 1-4 (nets S1-S4)</text>
  <text x="1380" y="379.55" font-size="10.5" fill="#ddd" text-anchor="middle">virtual-earth summing in the FX-RETs</text>
  <text x="1380" y="395.55" font-size="10.5" fill="#ddd" text-anchor="middle">multidrop net, like the DJ bus</text>
  <path d="M 1380 276 L 1380 338" stroke="#C05A1B" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <rect x="640" y="350" width="260" height="92" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="770" y="376.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">ASSIGN S1-S4 BUTTONS</text>
  <text x="770" y="392.2" font-size="10.5" fill="#444" text-anchor="middle">on the CHANNEL panel, lit</text>
  <text x="770" y="408.2" font-size="10.5" fill="#444" text-anchor="middle">latching (dec. 123) · +5 V over cable</text>
  <text x="770" y="424.2" font-size="10.5" fill="#444" text-anchor="middle">audio never passes through the contacts</text>
  <rect x="935" y="340" width="245" height="112" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1057.5" y="369.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">ZERO-CROSS SWITCHING (todo 224)</text>
  <text x="1057.5" y="384.7" font-size="10" fill="#444" text-anchor="middle">1 comparator per side + 74HC74</text>
  <text x="1057.5" y="400.2" font-size="10" fill="#444" text-anchor="middle">button → D, clock from the comparator</text>
  <text x="1057.5" y="415.7" font-size="10" fill="#8A4A9E" text-anchor="middle">step −51/−54 dB, delay 20-80 µs</text>
  <text x="1057.5" y="431.2" font-size="10" fill="#444" text-anchor="middle">(IN is a logic pin: an RC gives no ramp)</text>
  <path d="M 900 396 L 933 396" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 1180 396 L 1205 396 L 1205 300 L 1262 300 L 1262 278" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="1240" y="480" width="280" height="70" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1380" y="503.2" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">GLOBAL_MUTE (line c9)</text>
  <text x="1380" y="519.2" font-size="10.5" fill="#444" text-anchor="middle">from the master mute controller [L]</text>
  <text x="1380" y="535.2" font-size="10.5" fill="#444" text-anchor="middle">mutes the injection buffers (dec. 94b)</text>
  <path d="M 1240 515 L 918 515 L 918 300 L 1060 300 L 1060 278" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="40" y="340" width="560" height="210" rx="6" fill="#F3F2EE" stroke="#AAA" stroke-width="1"/>
  <text x="58" y="391.8" font-size="13" font-weight="700" fill="#141414">WHY A MICRO-MODULE</text>
  <text x="58" y="408.3" font-size="11" fill="#444">The CDJ channel stays simpler: only the SEND TAP remains there.</text>
  <text x="58" y="424.8" font-size="11" fill="#444">LOCKED behaviour unchanged (SPECIFICA §2): pickoff point,</text>
  <text x="58" y="441.3" font-size="11" fill="#444">EQ2 bands and law, level with no gain, multiple assigns.</text>
  <text x="58" y="457.8" font-size="11" fill="#444">Noise (todo 184): one assigned send −101.7 dBu A at the bus</text>
  <text x="58" y="474.3" font-size="11" fill="#444">at LEVEL max, floor −111.2. System with 4 sends fully up</text>
  <text x="58" y="490.8" font-size="11" fill="#444">on every bus: −81.8 dBu A, PASS: the dec. 95 waiver is not needed.</text>
  <text x="58" y="507.3" font-size="11" fill="#444">Pots on a control board behind the panel, 2×12 cable (dec. 136).</text>
  <path d="M 40 610 L 90 610" stroke="#C05A1B" stroke-width="2.5"/>
  <text x="98" y="614" font-size="11.5" fill="#333">audio</text>
  <path d="M 169 610 L 219 610" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="227" y="614" font-size="11.5" fill="#333">control: +5 V logic / mute</text>
  <text x="40" y="698" font-size="10.5" fill="#999">Source: docs/fase1/fx-send-module.md (§2 REV 2026-11-03, §3-§6) + sim/fx/RISULTATI-fx-send-assign.md + RISULTATI-send-chain-v2.md + pcb/fx-send/NOTE.md + decisions 91/94b/108/123/136 · 2026-11-04</text>
</svg>
