  <text x="58" y="784.2" font-size="10.5" fill="#444">→ ±18 V audio (LM317/337) · ±15.0 V LN (pre-reg ±16.5 → LT3045/94)</text>
  <text x="58" y="800.2" font-size="10.5" fill="#444">· +5 V control from the bus</text>
