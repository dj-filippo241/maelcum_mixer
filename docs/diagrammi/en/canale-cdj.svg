  <text x="147.5" y="386.375" font-size="10.5" fill="#444" text-anchor="middle">curve ≤ ±0.05 dB 100 Hz–20 kHz</text>
  <text x="147.5" y="402.375" font-size="10.5" fill="#444" text-anchor="middle">fixed 18 Hz subsonic (dec. 138)</text>
  <text x="147.5" y="418.375" font-size="10.5" fill="#444" text-anchor="middle">overload +18 dBu · phono-stage.md</text>
