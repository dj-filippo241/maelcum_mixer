  <text x="1105" y="131.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[D] CUE SEND</text>
  <text x="1105" y="147.55" font-size="10.5" fill="#444" text-anchor="middle">buffer → cue switch → CUE bus</text>
  <text x="1105" y="163.55" font-size="10.5" fill="#444" text-anchor="middle">post-EQ, pre-filter, pre-fader</text>
  <rect x="995" y="196" width="220" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1105" y="219.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[E] SEND TAP (dec. 91a)</text>
  <text x="1105" y="235.55" font-size="10.5" fill="#444" text-anchor="middle">buffer ≤ 50 Ω → backplane slot 3</text>
  <text x="1105" y="251.55" font-size="10.5" fill="#444" text-anchor="middle">EQ2 + level + assign live</text>
  <text x="1105" y="267.55" font-size="10.5" fill="#444" text-anchor="middle">in the FX-SEND micro-module</text>
