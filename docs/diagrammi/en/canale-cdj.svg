  <text x="1425" y="457.55" font-size="10.5" fill="#444" text-anchor="middle">10 seg × 3 dB (LM3915)</text>
  <text x="1425" y="473.55" font-size="10.5" fill="#444" text-anchor="middle">pre-fader, no filter (161b)</text>
  <rect x="1330" y="516" width="190" height="76" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1425" y="534.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[H] FADER → 2 VCAs</text>
  <text x="1425" y="550.55" font-size="10.5" fill="#444" text-anchor="middle">100 mm mono fader (dec. 126)</text>
  <text x="1425" y="566.55" font-size="10.5" fill="#444" text-anchor="middle">trimmed VCAs + I/V</text>
  <text x="1425" y="582.55" font-size="10.5" fill="#444" text-anchor="middle">«slow rise» curve (129 G)</text>
  <rect x="1330" y="622" width="190" height="70" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1425" y="637.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[I] OUT + TOGGLE</text>
  <text x="1425" y="653.55" font-size="10.5" fill="#444" text-anchor="middle">HPF / OFF / LPF (ADG)</text>
  <text x="1425" y="669.55" font-size="10.5" fill="#444" text-anchor="middle">→ DJ bus / HPF bus / LPF bus</text>
  <text x="1425" y="685.55" font-size="10.5" fill="#444" text-anchor="middle">R 10k onto the nets (dec. 159)</text>
  <text x="1425" y="708" font-size="10" fill="#C05A1B" text-anchor="middle">0 dBu nom / +16 worst</text>
