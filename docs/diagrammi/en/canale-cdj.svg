  <text x="1425" y="115" font-size="10" fill="#444" text-anchor="middle">100 mm mono slider</text>
  <text x="1425" y="130.5" font-size="10" fill="#444" text-anchor="middle">→ shaper → CV of the 2 VCAs</text>
  <path d="M 1520 122 L 1542 122 L 1542 554 L 1522 554" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <rect x="985" y="520" width="300" height="150" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.2"/>
  <text x="1135" y="552.7" font-size="12" font-weight="700" fill="#2F6D8E" text-anchor="middle">DIP LOGIC (dec. 163)</text>
  <text x="1135" y="568.2" font-size="10" fill="#444" text-anchor="middle">74HC86 + 74HC14 + 74HC74, RC debounce</text>
  <text x="1135" y="583.7" font-size="10" fill="#444" text-anchor="middle">2 RC cells 10k/50n + buffer → VCA EC−</text>
  <text x="1135" y="599.2" font-size="10" fill="#444" text-anchor="middle">VCA down to −100 dB in ~1 ms,</text>
  <text x="1135" y="614.7" font-size="10" fill="#444" text-anchor="middle">ADG switches at ~1.6 ms, back up in ~3 ms</text>
  <text x="1135" y="630.2" font-size="10" fill="#8A4A9E" text-anchor="middle">by ear: a 3-4 ms breath, no click</text>
  <text x="1135" y="645.7" font-size="10" fill="#444" text-anchor="middle">CUE, sends and meter don't see it</text>
  <path d="M 1285 554 L 1328 554" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <path d="M 1285 650 L 1328 650" stroke="#2F6D8E" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arw)"/>
