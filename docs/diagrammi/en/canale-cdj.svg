  <rect width="1560" height="900" fill="#FBFAF7"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">CDJ / LINE CHANNEL MODULE</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.4 + isolator v0.5 (crossovers C) · dual-pot GAIN (dec. 162) · filter toggle with fader dip (dec. 163) — L half; R identical</text>
  <rect x="1304" y="34" width="216" height="24" rx="12" fill="#1F7A4D"/>
  <text x="1412" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">MM phono included (dec. 79)</text>
  <rect x="40" y="170" width="130" height="72" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="105" y="202.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">RCA IN</text>
  <text x="105" y="218.55" font-size="10.5" fill="#444" text-anchor="middle">line −10 dBV…+4 dBu</text>
  <text x="105" y="258" font-size="10" fill="#C05A1B" text-anchor="middle">0 dBu nom / +8 worst</text>
  <rect x="215" y="170" width="165" height="72" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="297.5" y="194.55" font-size="13" font-weight="700" fill="#141414" text-anchor="middle">[A] PROT + BUFFER</text>
  <text x="297.5" y="210.55" font-size="10.5" fill="#444" text-anchor="middle">R 100 Ω + TVS low-cap + bead</text>
  <text x="297.5" y="226.55" font-size="10.5" fill="#444" text-anchor="middle">OPA1612 unity, Zin 100k</text>
  <rect x="425" y="162" width="185" height="88" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="517.5" y="186.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">[B] GAIN (dec. 162)</text>
  <text x="517.5" y="202.2" font-size="10.5" fill="#444" text-anchor="middle">matched dual-gang linear pot</text>
  <text x="517.5" y="218.2" font-size="10.5" fill="#444" text-anchor="middle">Rl 4.30k + non-inverting ×3.15</text>
  <text x="517.5" y="234.2" font-size="10.5" fill="#444" text-anchor="middle">−∞ … 0 (detent) … +10 dB</text>
  <text x="517" y="266" font-size="10" fill="#C05A1B" text-anchor="middle">post: 0 / +10 dBu worst</text>
  <rect x="650" y="150" width="250" height="112" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="775" y="178.2" font-size="12" font-weight="700" fill="#141414" text-anchor="middle">[C] 4-BAND ISOLATOR EQ (v0.5)</text>
  <text x="775" y="194.2" font-size="10.5" fill="#444" text-anchor="middle">parallel bands (dec. 105)</text>
  <text x="775" y="210.2" font-size="10.5" fill="#444" text-anchor="middle">crossovers C: 150 LR2 / 350 / 3150 Hz (152)</text>
  <text x="775" y="226.2" font-size="10.5" fill="#444" text-anchor="middle">fully CCW −48 dB … 0 (detent) … +6 dB</text>
  <text x="775" y="242.2" font-size="10.5" fill="#444" text-anchor="middle">non-inverting sum + DC servo</text>
  <text x="775" y="278" font-size="10" fill="#C05A1B" text-anchor="middle">post: 0 / +16 dBu worst</text>
