<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C05A1B"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F6D8E"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/>
    </marker>
  </defs>

  <rect width="1560" height="880" fill="#FBFAF7"/>

  <text x="40" y="52" font-size="24" font-weight="700" fill="#141414">MODULO MASTER OUT</text>
  <text x="40" y="76" font-size="13" fill="#666">maelcum mixer — design v0.2 + addendum REC (decisioni 49-55, 63) · tre rami indipendenti dallo stesso bus (mai un buffer unico splittato)</text>

  <!-- ingresso -->
  <rect x="40" y="130" width="200" height="76" rx="6" fill="#141414"/>
  <text x="140" y="160" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">MASTER SUM BUS</text>
  <text x="140" y="178" font-size="10.5" fill="#bbb" text-anchor="middle">dal backplane, stereo</text>
  <text x="140" y="194" font-size="10.5" fill="#bbb" text-anchor="middle">0 dBu nom / +12…+20 worst</text>

  <!-- RAMO A -->
  <rect x="330" y="112" width="180" height="60" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="136" font-size="12.5" font-weight="700" text-anchor="middle">[A] IN BUFFER ×2</text>
  <text x="420" y="154" font-size="10.5" fill="#444" text-anchor="middle">OPA1612, ±18 V</text>

  <rect x="330" y="196" width="180" height="66" rx="6" fill="#fff" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="420" y="220" font-size="12.5" font-weight="700" text-anchor="middle">[A2] SUMMING ×2</text>
  <text x="420" y="238" font-size="10.5" fill="#444" text-anchor="middle">opzionale (§3.1 — q. 38:</text>
  <text x="420" y="252" font-size="10.5" fill="#444" text-anchor="middle">chi esegue la somma finale)</text>

  <rect x="330" y="286" width="180" height="86" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="310" font-size="12.5" font-weight="700" text-anchor="middle">[D] MASTER LEVEL ×1</text>
  <text x="420" y="328" font-size="10.5" fill="#444" text-anchor="middle">2× VCA THAT 218x (L/R), un CV</text>
  <text x="420" y="344" font-size="10.5" fill="#444" text-anchor="middle">−∞ → 0 (detent ~75-80%) → +6 dB</text>
  <text x="420" y="360" font-size="10.5" fill="#444" text-anchor="middle">CV: pot 10k → shaper → buffer</text>

  <rect x="330" y="396" width="180" height="60" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="420" font-size="12.5" font-weight="700" text-anchor="middle">[E] METER PICKUP</text>
  <text x="420" y="438" font-size="10.5" fill="#444" text-anchor="middle">peak L/R + clip detector (q. 19)</text>

  <rect x="330" y="480" width="180" height="60" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="504" font-size="12.5" font-weight="700" text-anchor="middle">[F] OUT FRONT ×2</text>
  <text x="420" y="522" font-size="10.5" fill="#444" text-anchor="middle">OPA1612, ±18 V</text>

  <rect x="330" y="564" width="180" height="76" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="588" font-size="12.5" font-weight="700" text-anchor="middle">[G] STADIO HV ×2</text>
  <text x="420" y="606" font-size="10.5" fill="#444" text-anchor="middle">discreto, ±24 V (unico punto</text>
  <text x="420" y="620" font-size="10.5" fill="#444" text-anchor="middle">del mixer a +24 dBu reali)</text>

  <rect x="330" y="664" width="180" height="56" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="420" y="686" font-size="12.5" font-weight="700" text-anchor="middle">[H] MUTE + PROTEZIONE</text>
  <text x="420" y="704" font-size="10.5" fill="#444" text-anchor="middle">comandato da [L]</text>

  <rect x="330" y="744" width="180" height="52" rx="6" fill="#141414"/>
  <text x="420" y="766" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">[I] XLR MASTER L/R</text>
  <text x="420" y="784" font-size="10.5" fill="#bbb" text-anchor="middle">bilanciato, +24 dBu capable</text>

  <!-- RAMO B (booth) -->
  <rect x="640" y="112" width="180" height="60" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="730" y="136" font-size="12.5" font-weight="700" text-anchor="middle">[B] BOOTH BUFFER ×2</text>
  <text x="730" y="154" font-size="10.5" fill="#444" text-anchor="middle">±18 V</text>

  <rect x="640" y="196" width="180" height="66" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="730" y="220" font-size="12.5" font-weight="700" text-anchor="middle">[B2] BOOTH LEVEL</text>
  <text x="730" y="238" font-size="10.5" fill="#444" text-anchor="middle">VCA 218x singoli (L/R)</text>
  <text x="730" y="252" font-size="10.5" fill="#444" text-anchor="middle">−∞ → 0 dB, pot dedicato</text>

  <rect x="640" y="286" width="180" height="60" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="730" y="310" font-size="12.5" font-weight="700" text-anchor="middle">[B3] BOOTH DRIVER ×2</text>
  <text x="730" y="328" font-size="10.5" fill="#444" text-anchor="middle">±18 V</text>

  <rect x="640" y="370" width="180" height="52" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="730" y="392" font-size="12.5" font-weight="700" text-anchor="middle">[B4] BOOTH MUTE</text>
  <text x="730" y="408" font-size="10.5" fill="#444" text-anchor="middle">comandato da [L]</text>

  <rect x="640" y="446" width="180" height="52" rx="6" fill="#141414"/>
  <text x="730" y="468" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">[B5] USCITA BOOTH</text>
  <text x="730" y="486" font-size="10.5" fill="#bbb" text-anchor="middle">XLR o TRS [APERTO-F]</text>

  <!-- RAMO C (rec) -->
  <rect x="950" y="112" width="180" height="60" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1040" y="136" font-size="12.5" font-weight="700" text-anchor="middle">[C] REC BUFFER ×2</text>
  <text x="1040" y="154" font-size="10.5" fill="#444" text-anchor="middle">±18 V (decisione 63)</text>

  <rect x="950" y="196" width="180" height="66" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1040" y="220" font-size="12.5" font-weight="700" text-anchor="middle">[C2] ATTENUATORE</text>
  <text x="1040" y="238" font-size="10.5" fill="#444" text-anchor="middle">fisso, partitore di precisione</text>
  <text x="1040" y="252" font-size="10.5" fill="#444" text-anchor="middle">livello adatto allo Zoom</text>

  <rect x="950" y="286" width="180" height="52" rx="6" fill="#fff" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="1040" y="308" font-size="12.5" font-weight="700" text-anchor="middle">[C3] REC MUTE</text>
  <text x="1040" y="324" font-size="10.5" fill="#444" text-anchor="middle">comandato da [L]</text>

  <rect x="950" y="362" width="180" height="52" rx="6" fill="#141414"/>
  <text x="1040" y="384" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">[C4] USCITA REC</text>
  <text x="1040" y="402" font-size="10.5" fill="#bbb" text-anchor="middle">TRS/mini-jack [APERTO-F]</text>

  <!-- MUTE CONTROLLER + PSU -->
  <rect x="1230" y="286" width="290" height="86" rx="6" fill="#EEF3F6" stroke="#2F6D8E" stroke-width="1.5"/>
  <text x="1375" y="310" font-size="12.5" font-weight="700" fill="#2F6D8E" text-anchor="middle">[L] MUTE CONTROLLER</text>
  <text x="1375" y="328" font-size="10.5" fill="#444" text-anchor="middle">analogico: supervisore rail + timer</text>
  <text x="1375" y="344" font-size="10.5" fill="#444" text-anchor="middle">comanda [H], [B4], [C3] — ordine:</text>
  <text x="1375" y="360" font-size="10.5" fill="#444" text-anchor="middle">mute PRIMA dei rail (niente pop)</text>

  <rect x="1230" y="400" width="290" height="130" rx="6" fill="#F4F2EC" stroke="#8A8A8A" stroke-width="1"/>
  <text x="1375" y="424" font-size="12.5" font-weight="700" fill="#333" text-anchor="middle">[M] PSU LOCALE</text>
  <text x="1250" y="446" font-size="10.5" fill="#444">±24 V main in → ±24 V filtrato (stadio HV [G])</text>
  <text x="1250" y="464" font-size="10.5" fill="#444">±18 V LDO (front / VCA / booth / rec)</text>
  <text x="1250" y="482" font-size="10.5" fill="#444">±15 V ultra-low-noise LT3045/3094 (summing,</text>
  <text x="1250" y="498" font-size="10.5" fill="#444">meter, CV — decisione 54)</text>
  <text x="1250" y="516" font-size="10.5" fill="#444">+5 V control (LED, logiche mute)</text>

  <!-- frecce audio -->
  <g stroke="#C05A1B" stroke-width="2.5" fill="none">
    <path d="M 240 152 L 325 142" marker-end="url(#ar)"/>
    <path d="M 240 168 L 635 142" marker-end="url(#ar)"/>
    <path d="M 240 184 L 945 142" marker-end="url(#ar)"/>
    <path d="M 420 172 L 420 191" marker-end="url(#ar)"/>
    <path d="M 420 262 L 420 281" marker-end="url(#ar)"/>
    <path d="M 420 372 L 420 391" marker-end="url(#ar)"/>
    <path d="M 420 456 L 420 475" marker-end="url(#ar)"/>
    <path d="M 420 540 L 420 559" marker-end="url(#ar)"/>
    <path d="M 420 640 L 420 659" marker-end="url(#ar)"/>
    <path d="M 420 720 L 420 739" marker-end="url(#ar)"/>
    <path d="M 730 172 L 730 191" marker-end="url(#ar)"/>
    <path d="M 730 262 L 730 281" marker-end="url(#ar)"/>
    <path d="M 730 346 L 730 365" marker-end="url(#ar)"/>
    <path d="M 730 422 L 730 441" marker-end="url(#ar)"/>
    <path d="M 1040 172 L 1040 191" marker-end="url(#ar)"/>
    <path d="M 1040 262 L 1040 281" marker-end="url(#ar)"/>
    <path d="M 1040 338 L 1040 357" marker-end="url(#ar)"/>
  </g>
  <!-- mute control -->
  <g stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 3" fill="none">
    <path d="M 1225 300 L 1135 300" marker-end="url(#arw)"/>
    <path d="M 1225 322 L 1195 322 L 1195 350 L 730 350 L 730 365" marker-end="url(#arw)"/>
    <path d="M 1225 350 L 1160 350 L 1160 692 L 515 692" marker-end="url(#arw)"/>
  </g>
  <text x="1150" y="316" font-size="10" fill="#2F6D8E">mute → [C3]</text>
  <text x="960" y="344" font-size="10" fill="#2F6D8E">mute → [B4]</text>
  <text x="800" y="686" font-size="10" fill="#2F6D8E">mute → [H]</text>

  <!-- note livello -->
  <text x="540" y="330" font-size="10" fill="#C05A1B">dominio ±18 V: +23 dBu max (K4)</text>
  <text x="540" y="600" font-size="10" fill="#C05A1B">+24 dBu reali SOLO qui (±24 V)</text>

  <!-- legenda -->
  <g font-size="11" fill="#444">
    <line x1="40" y1="816" x2="90" y2="816" stroke="#C05A1B" stroke-width="2.5"/>
    <text x="98" y="820">audio</text>
    <line x1="170" y1="816" x2="220" y2="816" stroke="#2F6D8E" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="228" y="820">controllo / mute</text>
    <rect x="360" y="808" width="52" height="16" rx="3" fill="#fff" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="424" y="820">blocco opzionale / provvisorio</text>
    <rect x="660" y="808" width="46" height="16" rx="8" fill="#D97706"/>
    <text x="718" y="820">[APERTO-F] = decisione di Filippo</text>
  </g>

  <text x="40" y="858" font-size="10.5" fill="#999">Fonte: docs/fase1/master-out.md v0.2 + ADDENDUM REC (dec. 63) · VCA singoli 218x (correzione datasheet 2026-09-27) · tracking stereo: trim di law / selezione coppie (q. 53) · 2026-09-28</text>
</svg>
